<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=no">
<title>まるぽんアクション</title>
<style>
  html,body{margin:0;height:100%;background:#2b2140;overflow:hidden;touch-action:none;-webkit-user-select:none;user-select:none}
  body{display:flex;align-items:center;justify-content:center}
  #wrap{position:relative;width:min(100vw,calc(100vh*800/448));aspect-ratio:800/448}
  canvas{width:100%;height:100%;display:block;border-radius:6px;box-shadow:0 8px 40px #0008}
  .tb{position:absolute;bottom:4%;width:13%;aspect-ratio:1;border-radius:50%;background:#fff5;border:3px solid #fff9;
      color:#fff;font:bold 3.4vmin sans-serif;display:none;align-items:center;justify-content:center;text-align:center}
  .tb.on{background:#fffa;color:#333}
  body.touch .tb{display:flex}
  body.inmini .tb{display:none!important}
</style>
</head>
<body>
<div id="wrap">
  <canvas id="c"></canvas>
  <div class="tb" id="bL" style="left:3%">◀</div>
  <div class="tb" id="bR" style="left:18%">▶</div>
  <div class="tb" id="bF" style="right:35%">たま</div>
  <div class="tb" id="bD" style="left:33%">▼<br>はいる</div>
  <div class="tb" id="bRun" style="right:19%">ダッシュ</div>
  <div class="tb" id="bJ" style="right:3%">ジャンプ</div>
</div>
<script src="stages.js"></script>
<script src="https://unpkg.com/peerjs@1.5.4/dist/peerjs.min.js"></script>
<script src="netplay.js"></script>
<script src="minigames.js"></script>
<script>
'use strict';
// ============================================================
//  まるぽんアクション  -  ちょっといじわるな 2D アクション
//  (ステージの中身は stages.js)
// ============================================================
const W=800,H=448,T=32,DPR=2;
const cv=document.getElementById('c'),ctx=cv.getContext('2d');
cv.width=W*DPR;cv.height=H*DPR;
const FONT="'Hiragino Maru Gothic ProN','Yu Gothic UI','Meiryo',sans-serif";
const OUT='#4a3030';

// ---------- sound ----------
let ac=null;
function initAudio(){ if(!ac){ try{ac=new (window.AudioContext||window.webkitAudioContext)();}catch(e){} } if(ac&&ac.state==='suspended')ac.resume(); }
function beep(f,d,type='square',vol=.05,slide=0,delay=0){
  if(!ac)return; const t=ac.currentTime+delay, o=ac.createOscillator(), g=ac.createGain();
  o.type=type; o.frequency.setValueAtTime(f,t);
  if(slide)o.frequency.exponentialRampToValueAtTime(Math.max(30,f+slide),t+d);
  g.gain.setValueAtTime(vol,t); g.gain.exponentialRampToValueAtTime(.0001,t+d);
  o.connect(g);g.connect(ac.destination);o.start(t);o.stop(t+d);
}
const sfx={
  jump:()=>beep(380,.18,'square',.05,420),
  coin:()=>{beep(988,.08,'square',.05);beep(1319,.25,'square',.05,0,.07)},
  stomp:()=>beep(220,.15,'square',.07,-120),
  brk:()=>beep(120,.2,'sawtooth',.06,-60),
  die:()=>{beep(500,.12,'square',.06,-200);beep(300,.4,'square',.06,-250,.12)},
  boom:()=>beep(90,.3,'sawtooth',.09,-50),
  check:()=>{beep(660,.1);beep(880,.1,'square',.05,0,.1);beep(1320,.2,'square',.05,0,.2)},
  win:()=>[523,659,784,1047,784,1047].forEach((f,i)=>beep(f,.18,'square',.05,0,i*.13)),
  bump:()=>beep(160,.08,'square',.05),
  item:()=>{[523,659,784,1047,1319].forEach((f,i)=>beep(f,.1,'square',.05,0,i*.06))},
  fire:()=>beep(700,.12,'square',.04,-400),
  oneup:()=>{[659,784,1319,1047,1175,1568].forEach((f,i)=>beep(f,.1,'square',.05,0,i*.08))},
};

// ---------- input ----------
const keys={left:0,right:0,jump:0,run:0,fire:0,down:0,jumpPressed:0,firePressed:0,downPressed:0};
const KMAP={ArrowLeft:'left',KeyA:'left',ArrowRight:'right',KeyD:'right',
  Space:'jump',ArrowUp:'jump',KeyZ:'jump',KeyW:'jump',
  ShiftLeft:'run',ShiftRight:'run',KeyX:'run',KeyC:'fire',ArrowDown:'down',KeyS:'down'};
function pauseGame(){if(state==='play'){state='pause';keys.left=keys.right=keys.jump=keys.run=keys.fire=0;keys.jumpPressed=keys.firePressed=0}}
function resumeGame(){if(state==='pause'){state='play';keys.left=keys.right=keys.jump=keys.run=keys.fire=0;keys.jumpPressed=keys.firePressed=0}}
function press(k){
  if(k==='jump'&&!keys.jump)keys.jumpPressed=1;
  if(k==='fire'&&!keys.fire)keys.firePressed=1;
  if(k==='down'&&!keys.down)keys.downPressed=1;
  keys[k]=1;
}
function release(k){ keys[k]=0; }
const raw={},ptr={x:0,y:0,down:false,press:false,rel:false};
const pk={},mi={l:0,r:0,u:0,d:0,a:0,b:0,pl:0,pr:0,pu:0,pd:0,pa:0,pb:0,px:0,py:0,pdown:false,ppress:false,prel:false};
let mSel=0,mgame=null,mEnd=0,mNew=false,netOn=false,netMsg='',netSel=0,joinCode='';
function leaveNet(){Net.leave();netOn=false;netMsg='';joinCode=''}
Net.S.on.start=(g,seed)=>{if(netOn)startMini(g,seed)};
Net.S.on.lobby=()=>{if(netOn&&(state==='miniresult'||state==='miniplay'))state='netlobby'};
Net.S.on.closed=()=>{if(netOn){netOn=false;netMsg=Net.S.error;state='net'}};
Net.S.on.state=()=>{
  if(!netOn)return;
  if(Net.S.status==='lobby'&&(state==='netjoin'||state==='netwait'))state='netlobby';
  else if(Net.S.status==='error'){netMsg=Net.S.error;if(state==='netjoin'){joinCode=''}else{netOn=false;Net.leave();state='net'}}
};
function mpLive(){return mgame&&mgame.live!==undefined?mgame.live:(mgame?mgame.score:0)}
function refreshMi(){
  const cur={l:raw.ArrowLeft||raw.KeyA,r:raw.ArrowRight||raw.KeyD,u:raw.ArrowUp||raw.KeyW,d:raw.ArrowDown||raw.KeyS,a:raw.Space||raw.KeyZ||raw.Enter,b:raw.KeyX||raw.ShiftLeft||raw.ShiftRight};
  for(const k in cur){const v=!!cur[k];mi['p'+k]=v&&!pk[k];mi[k]=v;pk[k]=v}
  mi.px=ptr.x;mi.py=ptr.y;mi.pdown=ptr.down;mi.ppress=ptr.press;mi.prel=ptr.rel;ptr.press=false;ptr.rel=false;
}
function doJoin(){netOn=true;netMsg='';Net.join(joinCode);state='netjoin'}
function openMini(){state='mini';mgame=null;frame=0;try{document.body.classList.add('inmini')}catch(e){}}
function leaveMini(to){state=to;mgame=null;try{document.body.classList.remove('inmini')}catch(e){}}
function startMini(i,seed){
  mSel=i;mgame=MINIGAMES[i].create(seed===undefined?1+Math.floor(Math.random()*2147483000):seed);mEnd=0;mNew=false;state='miniplay';frame=0;
  for(const k in raw)raw[k]=0;ptr.down=false;ptr.press=false;ptr.rel=false;
}
addEventListener('keyup',e=>{raw[e.code]=0});
addEventListener('keydown',e=>{
  initAudio();raw[e.code]=1;
  if(state==='net'){
    if(e.code==='ArrowUp'||e.code==='ArrowDown')netSel=1-netSel;
    else if(e.code==='Enter'||e.code==='Space')keys.jumpPressed=1;
    else if(e.code==='Escape')openMini();
    e.preventDefault();return;
  }
  if(state==='netjoin'){
    if(e.code==='Escape'){state='net'}
    else if(e.code==='Backspace')joinCode=joinCode.slice(0,-1);
    else if(e.key&&e.key.length===1&&Net.chars.includes(e.key.toUpperCase())&&joinCode.length<4){joinCode+=e.key.toUpperCase();if(joinCode.length===4)doJoin()}
    e.preventDefault();return;
  }
  if(state==='netlobby'||state==='netwait'){
    if(e.code==='Escape'){leaveNet();state='net'}
    else if(Net.S.isHost&&(e.code==='ArrowLeft'||e.code==='ArrowRight')){const n=MINIGAMES.length;Net.select((Net.S.game+(e.code==='ArrowRight'?1:n-1))%n)}
    else if(e.code==='Enter'||e.code==='Space')keys.jumpPressed=1;
    e.preventDefault();return;
  }
  if(state==='mini'){
    const n=MINIGAMES.length;
    if(e.code==='KeyR'){state='net';netSel=0;netMsg='';e.preventDefault();return}
    if(e.code==='ArrowLeft')mSel=(mSel+n-1)%n;
    else if(e.code==='ArrowRight')mSel=(mSel+1)%n;
    else if(e.code==='ArrowUp')mSel=(mSel+n-4)%n;
    else if(e.code==='ArrowDown')mSel=(mSel+4)%n;
    else if(e.code==='Enter'||e.code==='Space')keys.jumpPressed=1;
    else if(e.code==='Escape')leaveMini('select');
    e.preventDefault();return;
  }
  if(state==='miniplay'||state==='miniresult'){
    if(e.code==='Escape'){if(netOn)leaveNet();openMini()}
    else if(state==='miniresult'&&(e.code==='Enter'||e.code==='Space'))keys.jumpPressed=1;
    e.preventDefault();return;
  }
  if(e.code==='KeyM'&&(state==='select'||state==='title')){openMini();return}
  if(state==='select'){
    const n=STAGES.length;
    if(e.code==='ArrowLeft')sel=Math.max(1,sel-1);
    else if(e.code==='ArrowRight')sel=Math.min(n,sel+1);
    else if(e.code==='ArrowUp')sel=Math.max(1,sel-5);
    else if(e.code==='ArrowDown')sel=Math.min(n,sel+5);
    else if(e.code==='Enter'||e.code==='Space')keys.jumpPressed=1;
    else if(e.code==='Escape'){state='title';frame=0}
    e.preventDefault();return;
  }
  if(state==='pause'){
    if(e.code==='KeyP'||e.code==='Escape'||e.code==='Enter'||e.code==='Space')resumeGame();
    else if(e.code==='KeyM'||e.code==='KeyQ'){state='select';sel=curStage}
    e.preventDefault();return;
  }
  if((e.code==='KeyP'||e.code==='Escape')&&state==='play'){pauseGame();e.preventDefault();return}
  if(e.code==='Escape'&&(state==='over'||state==='clear')){state='select';sel=curStage;return}
  const k=KMAP[e.code];
  if(k){press(k);e.preventDefault();}
  if(e.code==='Enter'){keys.jumpPressed=1;e.preventDefault();}
  if(e.code==='KeyC'&&state==='title'&&prog.stage!==null)titleChoice='cont';
});
addEventListener('keyup',e=>{const k=KMAP[e.code];if(k)release(k);});
addEventListener('blur',()=>{keys.left=keys.right=keys.jump=keys.run=keys.fire=keys.down=0;pauseGame()});
if(document.addEventListener)document.addEventListener('visibilitychange',()=>{if(document.hidden)pauseGame()});
// touch
function bindBtn(id,k){
  const el=document.getElementById(id);
  const on=e=>{e.preventDefault();initAudio();document.body.classList.add('touch');press(k);el.classList.add('on')};
  const off=e=>{e.preventDefault();release(k);el.classList.remove('on')};
  el.addEventListener('pointerdown',on);el.addEventListener('pointerup',off);
  el.addEventListener('pointercancel',off);el.addEventListener('pointerleave',off);
}
bindBtn('bL','left');bindBtn('bR','right');bindBtn('bJ','jump');bindBtn('bRun','run');bindBtn('bF','fire');bindBtn('bD','down');
function setPtr(e){const r=cv.getBoundingClientRect();ptr.x=(e.clientX-r.left)/r.width*W;ptr.y=(e.clientY-r.top)/r.height*H}
cv.addEventListener('pointermove',e=>{setPtr(e)});
addEventListener('pointerup',e=>{if(ptr.down){ptr.down=false;ptr.rel=true}});
addEventListener('pointercancel',e=>{if(ptr.down){ptr.down=false;ptr.rel=true}});
cv.addEventListener('pointerdown',e=>{
  initAudio();
  const r=cv.getBoundingClientRect(),px=(e.clientX-r.left)/r.width*W,py=(e.clientY-r.top)/r.height*H;
  setPtr(e);ptr.down=true;ptr.press=true;
  if(state==='net'){
    if(px>=150&&px<=650&&py>=130&&py<=220){netSel=0;netOn=true;netMsg='';Net.host();state='netwait'}
    else if(px>=150&&px<=650&&py>=240&&py<=330){netSel=1;joinCode='';netMsg='';state='netjoin'}
    else if(px<110&&py<44)openMini();
    return;
  }
  if(state==='netjoin'){
    if(px<110&&py<44){if(netOn)leaveNet();state='net';return}
    if(netOn&&Net.S.status==='joining')return;
    const ch=Net.chars,ci=Math.floor((px-80)/80),ri=Math.floor((py-200)/62);
    if(ci>=0&&ci<8&&ri>=0&&ri<3&&py<=386){
      const k=ri*8+ci;
      if(k<ch.length){if(joinCode.length<4){joinCode+=ch[k];if(joinCode.length===4)doJoin()}}
      else if(k===ch.length)joinCode=joinCode.slice(0,-1);
      else{state='net'}
    }
    return;
  }
  if(state==='netlobby'||state==='netwait'){
    if(px<110&&py<44){leaveNet();state='net';return}
    if(Net.S.isHost){
      const n=MINIGAMES.length;
      if(py>=250&&py<=330&&px<150)Net.select((Net.S.game+n-1)%n);
      else if(py>=250&&py<=330&&px>650)Net.select((Net.S.game+1)%n);
      else if(py>=360&&py<=424&&px>=250&&px<=550)keys.jumpPressed=1;
    }
    return;
  }
  if(state==='mini'){
    if(py>=384&&py<=428&&px>=250&&px<=550){state='net';netSel=0;netMsg='';return}
    for(let i=0;i<MINIGAMES.length;i++){const x=20+(i%4)*195,y=92+Math.floor(i/4)*148;
      if(px>=x&&px<=x+183&&py>=y&&py<=y+136){mSel=i;startMini(i);return}}
    if(px<110&&py<44)leaveMini('select');
    return;
  }
  if(state==='miniplay')return;
  if(state==='miniresult'){
    if(netOn){if(px<W/2){if(Net.S.isHost&&Net.S.phase==='result')Net.backToLobby()}else{leaveNet();openMini()}}
    else if(px<W/2)startMini(mSel);else openMini();
    return;
  }
  if(state==='select'&&px>W-150&&py<44){openMini();return}
  if(state==='title'){
    if(prog.stage!==null)titleChoice=px<W/2?'cont':'menu'; else titleChoice='menu';
  }else if(state==='select'){
    const per=10,page=Math.floor((sel-1)/per),pages=Math.ceil(STAGES.length/per);
    if(px<110&&py<44){state='title';frame=0;return}
    if(pages>1&&px<30){sel=Math.max(1,(page-1)*per+1);return}
    if(pages>1&&px>W-30){sel=Math.min(STAGES.length,(page+1)*per+1);return}
    for(let i=0;i<per;i++){
      const n=page*per+i+1; if(n>STAGES.length)break;
      const cx=31+(i%5)*150,cy=104+Math.floor(i/5)*136;
      if(px>=cx&&px<=cx+138&&py>=cy&&py<=cy+124){sel=n;keys.jumpPressed=1;return}
    }
  }else if(state==='play'){
    if(px>690&&py<44)pauseGame();
  }else if(state==='pause'){
    if(py>=260&&py<330){state='select';sel=curStage}else resumeGame();
  }else keys.jumpPressed=1;
});
if('ontouchstart' in window)document.body.classList.add('touch');

// ---------- themes ----------
const THEMES={
  grass :{sky:['#7fd0ff','#d8f3ff','#f4fbff'],sun:'#fff6b0',cloud:'#fff',cloud2:'#e6f1fb',hill:['#a6e58a','#8fd673'],hillDot:'#6fbf55',dirt:'#c0864c',dirt2:'#a8703a',top:'#5fcf4e',top2:'#8fe46f'},
  desert:{walkPal:{body:'#e6b25c',belly:'#f6dca2',foot:'#b0803a'},sky:['#ffbf6a','#ffe2a8','#fff3d6'],sun:'#fff3c0',cloud:'#fff7e8',cloud2:'#f6e4c4',hill:['#f0c47a','#e5b266'],hillDot:'#c99a50',dirt:'#d9a860',dirt2:'#c18e46',top:'#f2d78f',top2:'#f9e8b5'},
  snow  :{walkPal:{body:'#e8f1fb',belly:'#ffffff',foot:'#9ab2cc'},sky:['#9fc7ee','#d6e9fa','#f2f8ff'],sun:'#ffffff',cloud:'#fff',cloud2:'#dbe8f5',hill:['#e4eef9','#cfe0f2'],hillDot:'#b6cbe2',dirt:'#8fa7c4',dirt2:'#7a93b2',top:'#ffffff',top2:'#e8f6ff',ice:true,snow:true},
  night :{walkPal:{body:'#7a6ad0',belly:'#c9c0f5',foot:'#4f4396'},sky:['#141a4a','#2b2f78','#4a4a9a'],sun:'#f6f2d0',stars:true,cloud:'#6a70c0',cloud2:'#565cab',hill:['#3a3f8a','#2f3478'],hillDot:'#4a50a0',dirt:'#5a3f7a',dirt2:'#4a3266',top:'#4fd1a5',top2:'#7ae6c4'},
  sunset:{walkPal:{body:'#d96a7a',belly:'#ffc8b8',foot:'#9a3a52'},sky:['#ff8a6b','#ffc27a','#ffe9b8'],sun:'#fff0a0',cloud:'#ffd8bc',cloud2:'#f3b99a',hill:['#d96a7a','#c25a73'],hillDot:'#a84a62',dirt:'#a05a4a',dirt2:'#864838',top:'#9bd05a',top2:'#c0e87a'},
  cave  :{walkPal:{body:'#8a8fa6',belly:'#c9cddd',foot:'#585d73'},sky:['#2a2438','#3d3350','#54476a'],sun:null,cloud:null,cave:true,hill:['#4a3f5e','#40364f'],hillDot:'#5a4e70',dirt:'#6e6478',dirt2:'#5c5266',top:'#8a7fa0',top2:'#a99dc0'},
  candy :{walkPal:{body:'#ff9fd0',belly:'#ffe0f0',foot:'#d96aa8'},sky:['#ffa6d5','#ffd0ea','#fff0f8'],sun:'#fff6b0',cloud:'#fff',cloud2:'#ffe0f0',hill:['#ffb6dd','#ff9fd0'],hillDot:'#ff7fc0',dirt:'#ff9ac0',dirt2:'#ff7fb0',top:'#8be3ff',top2:'#c4f1ff'},
  forest:{walkPal:{body:'#6a8f3a',belly:'#d7e8a8',foot:'#44601f'},sky:['#4fa88a','#8fd0a8','#d4f2d8'],sun:'#fff6b0',cloud:'#e8fff0',cloud2:'#bfe6cc',hill:['#3f9a62','#2f8452'],hillDot:'#256f43',dirt:'#7a5a3a',dirt2:'#654a2e',top:'#3fb85a',top2:'#6fdc7a'},
  volcano:{walkPal:{body:'#c24a30',belly:'#ffb070',foot:'#7a2a18'},sky:['#3a1218','#7a2a22','#c85a32'],sun:'#ffd070',stars:true,cloud:'#8a4a40',cloud2:'#6e3a34',hill:['#5a2a2e','#4a2226'],hillDot:'#7a3a36',dirt:'#4a3238',dirt2:'#3a262c',top:'#ff8a3a',top2:'#ffc060'},
};
let TH=THEMES.grass;

// ---------- level ----------
let ROWS=14,GY=12,goalG=12,TOWER=false;
let zones=[],zonesById={},warpRet=null,downEdge=0,fadeT=0,curZ=null;
let COLS=140,GOAL_COL=133,goalX=0,map,ents,curStage=1;
const revealed=new Set();        // 一度見つけた隠しブロックは次から見える

function buildLevel(){
  const st=STAGES[curStage-1];
  TH=THEMES[st.theme]||THEMES.grass;
  TOWER=!!st.tower;ROWS=TOWER?st.tower.rows:14;GY=ROWS-2;goalG=GY;zones=[];zonesById={};warpRet=null;
  const MAXC=600;
  map=Array.from({length:ROWS},()=>Array(MAXC).fill(' '));
  ents=[];
  const set=(x,y,c)=>{if(x>=0&&x<MAXC&&y>=0&&y<ROWS)map[y][x]=c};
  const L={c:0,s:0,gn:0,zq:[]};
  const ground=(a,b)=>{for(let x=a;x<=b;x++){set(x,GY,'#');set(x,GY+1,'#')}};
  const X=dx=>L.s+dx;
  const mkWalk=(dx,kind,extra)=>ents.push(Object.assign({t:'walker',kind,x:X(dx)*T+2,y:GY*T-26,w:28,h:26,vx:0,vy:0,dir:-1,sq:0,active:false,hopT:0},extra));
  Object.assign(L,{
    flat(n){ground(L.c,L.c+n-1);L.s=L.c;L.c+=n;return L},
    gap(n){L.s=L.c;L.gn=n;L.c+=n;return L},
    row(dx,y,s){[...s].forEach((c,i)=>{if(c!==' ')set(X(dx)+i,y,c)})},
    plat(dx,y,len){for(let i=0;i<len;i++)set(X(dx)+i,y,'=')},
    pipe(dx,h){for(let j=0;j<h;j++){const y=GY-1-j,top=j===h-1;set(X(dx),y,top?'a':'c');set(X(dx)+1,y,top?'b':'d')}},
    stairs(dx,n,up){for(let i=0;i<n;i++){const col=X(dx)+(up?i:n-1-i);for(let j=0;j<=i;j++)set(col,11-j,'=')}},
    coin(dx,y){ents.push({t:'coin',x:X(dx)*T+8,y:y*T+8,w:16,h:16,ph:Math.random()*6})},
    coins(dx,y,n){for(let i=0;i<n;i++)L.coin(dx+i,y)},
    arc(dx,y,n){for(let i=0;i<n;i++)L.coin(dx+i,y-Math.round(Math.sin(i/Math.max(1,n-1)*Math.PI)*2))},
    walker(dx){mkWalk(dx,'walk')},
    hopper(dx){mkWalk(dx,'hop')},
    flyer(dx,y,rx){ents.push({t:'walker',kind:'fly',x:X(dx)*T+2,x0:X(dx)*T+2,y:y*T,y0:y*T,rx:rx*T,w:28,h:24,vx:0,vy:0,dir:-1,sq:0,active:false,ph:Math.random()*6})},
    spike(dx){ents.push({t:'spike',x:X(dx)*T,y:GY*T,w:T,h:0,st:0})},
    spikes(dx,n){for(let i=0;i<n;i++)ents.push({t:'spike',x:(X(dx)+i)*T,y:GY*T,w:T,h:30,st:1})},
    spring(dx){ents.push({t:'spring',x:X(dx)*T+2,y:GY*T-20,w:28,h:20,comp:0})},
    spiny(dx){mkWalk(dx,'spiny')},

const SOLID='#B?MSUFEJNDZu=abcdk';
const IT_BLOCK={E:'shield',J:'wing',N:'magnet',D:'dash',Z:'clock'};
const stageLabel=n=>(Math.floor((n-1)/10)+1)+'-'+((n-1)%10+1);
function tileAt(tx,ty){ return (ty<0||ty>=ROWS||tx<0||tx>=COLS)?' ':map[ty][tx]; }
function solidAt(tx,ty){
  if(tx<0||tx>=COLS)return true;
  if(ty<0||ty>=ROWS)return false;
  const c=map[ty][tx]; return c!==' '&&SOLID.includes(c);
}

function moveEntity(e,isPlayer){
  const py=e.y;
  e.x+=e.vx; e.hitX=false;
  let x0=Math.floor(e.x/T),x1=Math.floor((e.x+e.w-1)/T),y0=Math.floor(e.y/T),y1=Math.floor((e.y+e.h-1)/T);
  if(e.vx>0){for(let ty=y0;ty<=y1;ty++)if(solidAt(x1,ty)){e.x=x1*T-e.w;e.hitX=true;break}}
  else if(e.vx<0){for(let ty=y0;ty<=y1;ty++)if(solidAt(x0,ty)){e.x=(x0+1)*T;e.hitX=true;break}}
  if(e.hitX&&isPlayer)e.vx=0;
  e.y+=e.vy; e.onGround=false;
  x0=Math.floor(e.x/T);x1=Math.floor((e.x+e.w-1)/T);y0=Math.floor(e.y/T);y1=Math.floor((e.y+e.h-1)/T);
  if(e.vy>0){
    for(let tx=x0;tx<=x1;tx++)if(solidAt(tx,y1)){e.y=y1*T-e.h;e.vy=0;e.onGround=true;break}
  }else if(e.vy<0){
    const cx=e.x+e.w/2; let best=-1,bd=1e9;
    for(let tx=x0;tx<=x1;tx++){
      const hid=isPlayer&&tileAt(tx,y0)==='H'&&py>=(y0+1)*T-1;
      if(solidAt(tx,y0)||hid){const d=Math.abs(tx*T+T/2-cx);if(d<bd){bd=d;best=tx}}
    }
    if(best>=0){e.y=(y0+1)*T;e.vy=0;if(isPlayer)bump(best,y0);}
  }
}

// ---------- state ----------
let state='title';
let player,cam={x:0,y:0},lives=5,coins=0,score=0,checkX=null,checkY=null,checkPow=0,shake=0,winT=0,frame=0,bannerT=0,sel=1;
let particles=[],texts=[],bumps={},titleChoice=null;
const rnd=(a,b)=>a+Math.random()*(b-a);

// ---- セーブ (ブラウザに保存) ----
const PROG_KEY='marupon-prog-v4';
let prog={unlocked:1,cleared:{},coins:0,score:0,stage:null,checkX:null,checkY:null,pow:0,mini:{}};
function loadProg(){try{const s=JSON.parse(localStorage.getItem(PROG_KEY));if(s&&typeof s.unlocked==='number')prog=Object.assign(prog,s)}catch(e){}
  if(!prog.mini||typeof prog.mini!=='object')prog.mini={};
  for(const k in prog.cleared){const n=+k;if(prog.cleared[k]&&n>=1)prog.unlocked=Math.max(prog.unlocked,Math.min(STAGES.length,n+1))}}
function saveProg(){prog.coins=coins;prog.score=score;try{localStorage.setItem(PROG_KEY,JSON.stringify(prog))}catch(e){}}
loadProg();
coins=prog.coins;score=prog.score;sel=Math.min(STAGES.length,prog.unlocked);

function newPlayer(x){
  return {x,y:GY*T-28,w:24,h:28,vx:0,vy:0,onGround:true,face:1,coyote:0,jbuf:0,
    sx:1,sy:1,dead:false,deadT:0,t:0,blink:0,rot:0,win:false,big:false,fire:false,star:0,inv:0,ride:null};
}
function startStage(n,mode){
  curStage=n;revealed.clear();lives=5;coins=prog.coins;score=prog.score;
  checkX=(mode==='cont'&&prog.stage===n&&typeof prog.checkX==='number')?prog.checkX:null;
  checkY=(checkX!==null&&typeof prog.checkY==='number')?prog.checkY:null;
  checkPow=checkX!==null?(prog.pow|0):0;
  bannerT=150;loadLevel();state='play';sfx.coin();
}
function loadLevel(){
  buildLevel(); particles=[];texts=[];bumps={};winT=0;titleChoice=null;
  player=newPlayer(checkX!==null?checkX:2*T);fadeT=0;keys.downPressed=0;downEdge=0;
  if(TOWER&&checkX===null)player.x=3*T;
  if(checkX!==null&&checkY!==null)player.y=checkY;
  if(checkX!==null&&checkPow>0){const p=player;p.y-=12;p.h=40;p.x-=1;p.w=26;p.big=true;p.fire=checkPow>1}
  cam.x=Math.max(0,Math.min(player.x-W*0.35,COLS*T-W));
  cam.y=TOWER?Math.max(0,Math.min(player.y-H*.55,ROWS*T-H)):0;
  refreshTheme();
}
function refreshTheme(){
  const st=STAGES[curStage-1],z=zones.find(z=>player.x>=z.x0*T&&player.x<z.x1*T);
  curZ=z||null;
  TH=THEMES[z?z.theme:st.theme]||THEMES.grass;
}
function camTargetX(){
  const lo=curZ?curZ.x0*T:0,hi=curZ?curZ.x1*T-W:COLS*T-W;
  return Math.max(lo,Math.min(player.x-W*0.38,hi));
}
function rectFree(x,y,w,h){
  for(let ty=Math.floor(y/T);ty<=Math.floor((y+h-1)/T);ty++)
    for(let tx=Math.floor(x/T);tx<=Math.floor((x+w-1)/T);tx++)if(solidAt(tx,ty))return false;
  return true;
}
function grow(){
  const p=player,nw=26,nh=40,nx=p.x-(nw-p.w)/2,ny=p.y-(nh-p.h);
  if(p.big)return false;
  if(!rectFree(nx,ny,nw,nh))return false;
  p.x=nx;p.y=ny;p.w=nw;p.h=nh;p.big=true;p.sx=.7;p.sy=1.3;p.inv=30;
  return true;
}
function getItem(kind){
  const p=player,cx=p.x+p.w/2;
  if(kind==='mush'){
    sfx.item();sparkle(cx,p.y,'#ff8aa8');
    if(grow())addText(cx,p.y-10,'おおきくなった!','#ff8aa8'); else{score+=1000;addText(cx,p.y-10,'+1000','#fff')}
  }else if(kind==='flower'){
    sfx.item();sparkle(cx,p.y,'#ffb347');grow();
    if(!p.fire){p.fire=true;addText(cx,p.y-10,'たまが うてる! (C)','#ffb347')}else{score+=1000;addText(cx,p.y-10,'+1000','#fff')}
  }else if(kind==='star'){
    sfx.item();p.star=600;sparkle(cx,p.y,'#ffe45c');addText(cx,p.y-10,'むてき!','#ffe45c');
  }else if(kind==='shield'){
    sfx.item();p.shield=true;sparkle(cx,p.y,'#7ad6ff');addText(cx,p.y-10,'バリア! いちどだけ まもる','#7ad6ff');
  }else if(kind==='wing'){
    sfx.item();p.wing=1500;p.dj=false;sparkle(cx,p.y,'#ffffff');addText(cx,p.y-10,'つばさ! 2だんジャンプ','#fff');
  }else if(kind==='magnet'){
    sfx.item();p.magnet=1500;sparkle(cx,p.y,'#ff6a6a');addText(cx,p.y-10,'コインが よってくる!','#ff9a9a');
  }else if(kind==='dash'){
    sfx.item();p.dash=1200;sparkle(cx,p.y,'#ffb347');addText(cx,p.y-10,'ダッシュブーツ!','#ffb347');
  }else if(kind==='clock'){
    sfx.item();p.clock=420;sparkle(cx,p.y,'#9ad6ff');addText(cx,p.y-10,'じかんがとまる!','#9ad6ff');
  }else if(kind==='life'){
    sfx.oneup();lives++;addText(cx,p.y-10,'1UP!','#7ae66a');sparkle(cx,p.y,'#7ae66a');
  }
}
function hurt(){
  const p=player;
  if(p.dead||p.win||p.inv>0||p.star>0)return;
  if(p.shield){p.shield=false;p.inv=90;sfx.boom();puff(p.x+12,p.y+14,10);addText(p.x+12,p.y-10,'バリアが われた!','#7ad6ff');return}
  if(p.big){
    p.big=false;p.fire=false;p.y+=p.h-28;p.h=28;p.x+=(p.w-24)/2;p.w=24;p.inv=100;p.vy=Math.min(p.vy,-4);sfx.boom();puff(p.x+12,p.y+14,8);
  }else die();
}
function markCleared(){
  prog.cleared[curStage]=1;
  prog.unlocked=Math.max(prog.unlocked,Math.min(STAGES.length,curStage+1));
  if(prog.stage===curStage){prog.stage=null;prog.checkX=null}
  saveProg();
}
function addText(x,y,s,color='#fff'){texts.push({x,y,s,life:60,color})}
function puff(x,y,n=6){for(let i=0;i<n;i++)particles.push({x,y,vx:rnd(-1.5,1.5),vy:rnd(-1.5,-.2),life:20,max:20,c:'#fff',r:rnd(2,4),g:0})}
function sparkle(x,y,c='#ffe45c'){for(let i=0;i<8;i++){const a=i/8*6.28;particles.push({x,y,vx:Math.cos(a)*2.4,vy:Math.sin(a)*2.4,life:22,max:22,c,r:3,g:0,star:true})}}

function bump(tx,ty){
  const c=map[ty][tx];
  bumps[ty*COLS+tx]=0;
  const cx=tx*T+T/2,cy=ty*T;
  if('MSUFEJNDZ'.includes(c)){
    map[ty][tx]='u';sfx.bump();
    const kind=IT_BLOCK[c]||(c==='M'?(player.big?'flower':'mush'):c==='S'?'star':c==='U'?'life':'flower');
    ents.push({t:'item',kind,x:tx*T+4,y:ty*T,w:24,h:26,vx:0,vy:0,rise:0,dir:1,targetY:ty*T-26});
  }else if(c==='?'||c==='H'){
    map[ty][tx]='u';
    if(c==='H'){revealed.add(curStage+','+tx+','+ty);addText(cx,cy-8,'!?','#ff5a7a');shake=6}
    coins++;score+=10;sfx.coin();sparkle(cx,cy-10);addText(cx,cy-20,'+10','#ffe45c');
  }else if(c==='B'&&!player.big){
    sfx.bump();
  }else if(c==='B'){
    map[ty][tx]=' ';sfx.brk();
    for(let i=0;i<6;i++)particles.push({x:cx,y:cy+16,vx:rnd(-3,3),vy:rnd(-7,-3),life:50,max:50,c:'#e8914a',r:rnd(3,5),g:.5,sq:true});
  }else sfx.bump();
}

function die(){
  if(player.dead||player.win)return;
  player.dead=true;player.vy=-9;player.vx=0;player.deadT=0;lives--;sfx.die();
}

const overlap=(a,b)=>a.x<b.x+b.w&&a.x+a.w>b.x&&a.y<b.y+b.h&&a.y+a.h>b.y;

// ---------- update ----------
function update(){
  frame++;
  if(state==='pause'){keys.jumpPressed=0;keys.firePressed=0;return}
  if(state==='net'){
    if(keys.jumpPressed){if(netSel===0){netOn=true;netMsg='';Net.host();state='netwait'}else{joinCode='';netMsg='';state='netjoin'}}
    keys.jumpPressed=0;keys.firePressed=0;return;
  }
  if(state==='netjoin'){keys.jumpPressed=0;keys.firePressed=0;return}
  if(state==='netlobby'||state==='netwait'){
    Net.tick();
    if(keys.jumpPressed&&Net.S.isHost&&state==='netlobby'&&Net.S.players.length>=2)Net.start();
    else if(keys.jumpPressed&&Net.S.isHost&&Net.S.players.length<2)sfx.bump();
    keys.jumpPressed=0;keys.firePressed=0;return;
  }
  if(state==='mini'){if(keys.jumpPressed)startMini(mSel);keys.jumpPressed=0;keys.firePressed=0;return}
  if(state==='miniplay'){
    refreshMi();
    if(netOn){mgame.remotes=Net.others().map(p=>({name:p.name,live:p.live,done:p.done,score:p.score}));Net.tick()}
    if(!mgame.done){mgame.update();if(netOn)Net.report(mpLive(),false,0,'')}
    else{
      if(netOn&&mEnd===0)Net.report(mpLive(),true,mgame.score,mgame.scoreText||'');
      if(mEnd===0){const g=MINIGAMES[mSel],best=prog.mini[g.id]||0;mNew=mgame.score>best;if(mNew){prog.mini[g.id]=mgame.score;saveProg()}}
      mEnd++;mgame.update();
      if(mEnd>110){state='miniresult';frame=0}
    }
    keys.jumpPressed=0;keys.firePressed=0;return;
  }
  if(state==='miniresult'){
    if(netOn){Net.tick();if(keys.jumpPressed&&frame>15&&Net.S.isHost&&Net.S.phase==='result')Net.backToLobby()}
    else if(keys.jumpPressed&&frame>15)startMini(mSel);
    keys.jumpPressed=0;keys.firePressed=0;return;
  }
  if(state==='title'){
    if(keys.jumpPressed&&!titleChoice)titleChoice='menu';
    if(titleChoice==='cont'&&prog.stage!==null){const s=prog.stage;titleChoice=null;startStage(s,'cont')}
    else if(titleChoice){titleChoice=null;state='select';sel=Math.min(STAGES.length,prog.unlocked);sfx.coin()}
    keys.jumpPressed=0;keys.firePressed=0; return;
  }
  if(state==='select'){
    if(keys.jumpPressed){ if(sel<=prog.unlocked)startStage(sel,prog.stage===sel?'cont':'new'); else sfx.bump(); }
    keys.jumpPressed=0;keys.firePressed=0; return;
  }
  if(state==='over'){
    updateParticles();
    if(keys.jumpPressed&&frame>20){lives=5;checkX=null;checkY=null;checkPow=0;loadLevel();bannerT=150;state='play';sfx.coin()}
    keys.jumpPressed=0;keys.firePressed=0; return;
  }
  if(state==='clear'){
    updateParticles();
    if(keys.jumpPressed&&frame>20){
      if(curStage<STAGES.length)startStage(curStage+1,'new'); else{state='select';sel=curStage}
    }
    keys.jumpPressed=0;keys.firePressed=0; return;
  }
  if(bannerT>0)bannerT--;
  downEdge=keys.downPressed;keys.downPressed=0;
  if(fadeT>0)fadeT--;
  updateLifts(); updatePlayer(); updateEnts(); updateParticles(); refreshTheme();
  const target=camTargetX();
  cam.x+=(target-cam.x)*0.12;
  if(TOWER){const ty=Math.max(0,Math.min(player.y-H*.5,ROWS*T-H));cam.y+=(ty-cam.y)*.1}else cam.y=0;
  if(shake>0)shake--;
  keys.jumpPressed=0;keys.firePressed=0;
}

function updateLifts(){
  for(const l of ents){
    if(l.t!=='lift'||l.gone)continue;
    const ox=l.x,oy=l.y; l.tt++;
    if(l.kind==='h')l.x=l.cx-l.range*Math.cos(l.tt*l.sp);
    else if(l.kind==='v')l.y=l.cy-l.range*Math.cos(l.tt*l.sp);
    else if(l.kind==='drop'){
      if(player.ride===l)l.rt++;
      if(l.rt>22){l.vy+=.45;l.y+=l.vy}
      if(l.y>ROWS*T+60)l.gone=true;
    }
    l.dx=l.x-ox;l.dy=l.y-oy;
    if(player.ride===l&&!player.dead){player.x+=l.dx;player.y+=l.dy}
  }
}

function updatePlayer(){
  const p=player; p.t++;
  if(p.inv>0)p.inv--;
  if(p.star>0)p.star--;
  if(p.wing>0)p.wing--;if(p.magnet>0)p.magnet--;if(p.dash>0)p.dash--;if(p.clock>0)p.clock--;
  if(p.onGround)p.dj=false;
  if(p.blink>0)p.blink--; else if(Math.random()<0.008)p.blink=6;
  if(p.dead){
    p.deadT++;
    if(p.deadT>18){p.vy+=.5;p.y+=p.vy;}
    p.rot+=.15;
    if(p.deadT>110){ if(lives<=0){state='over';frame=0;checkX=null;checkPow=0;prog.stage=null;prog.checkX=null;prog.checkY=null;checkY=null;prog.pow=0;saveProg();} else loadLevel(); }
    return;
  }
  if(p.win){
    winT++;
    p.vx=winT<20?0:1.6; p.vy=Math.min(p.vy+.5,10); p.face=1; moveEntity(p,false);
    if(p.x>(GOAL_COL+3)*T||winT>140){ if(state==='play'){state='clear';frame=0;sfx.win();} }
    return;
  }
  const ice=TH.ice&&!p.ride;
  const dir=(keys.right?1:0)-(keys.left?1:0);
  const maxv=(keys.run?5:3.8)*(p.star>0?1.15:1)*(p.dash>0?1.3:1), acc=p.onGround?(ice?.16:.45):.3;
  if(dir){
    if(Math.sign(p.vx)!==dir&&p.vx!==0)p.vx+=dir*(ice&&p.onGround?.08:.35); // turn-around
    p.vx+=dir*acc; p.vx=Math.max(-maxv,Math.min(maxv,p.vx)); p.face=dir;
  }else{
    p.vx*=p.onGround?(ice?.97:.8):.96; if(Math.abs(p.vx)<.05)p.vx=0;
  }
  // fireball
  if(p.fire&&keys.firePressed){
    const n=ents.filter(e=>e.t==='fb'&&!e.gone).length;
    if(n<2){ents.push({t:'fb',x:p.x+p.w/2+p.face*10-5,y:p.y+p.h*.45,w:10,h:10,vx:p.face*6,vy:1,life:150,gone:false});sfx.fire()}
  }
  // jump
  p.jbuf=keys.jumpPressed?7:p.jbuf-1;
  p.coyote=p.onGround?6:p.coyote-1;
  if(p.jbuf>0&&p.coyote>0){
    p.vy=-12-Math.abs(p.vx)*.2;p.jbuf=0;p.coyote=0;p.onGround=false;p.ride=null;
    p.sx=.72;p.sy=1.35;sfx.jump();puff(p.x+p.w/2,p.y+p.h,5);
  }
  if(p.jbuf>0&&p.coyote<=0&&!p.onGround&&p.wing>0&&!p.dj){
    p.vy=-10.5;p.dj=true;p.jbuf=0;p.spr=false;p.sx=.8;p.sy=1.25;sfx.jump();for(let i=0;i<6;i++)particles.push({x:p.x+p.w/2,y:p.y+p.h,vx:rnd(-1.5,1.5),vy:rnd(0,1.5),life:22,max:22,c:'#fff',r:3,g:0});
  }
  if(p.vy>=0)p.spr=false;
  if(!keys.jump&&p.vy<-4&&!p.spr)p.vy=-4;
  const wasAir=!p.onGround, fall=p.vy;
  p.vy=Math.min(p.vy+.5,12);
  const vyPre=p.vy,pbot=p.y+p.h;
  moveEntity(p,true);
  // 動く足場にのる
  p.ride=null;
  for(const l of ents){
    if(l.t!=='lift'||l.gone)continue;
    const bot=p.y+p.h;
    if(vyPre>=0&&p.x+p.w>l.x+3&&p.x<l.x+l.w-3&&pbot<=l.y+10+Math.max(0,l.dy)&&bot>=l.y-1&&bot<=l.y+24){
      p.y=l.y-p.h;p.vy=0;p.onGround=true;p.ride=l;break;
    }
  }
  if(p.onGround&&wasAir&&fall>3){p.sx=1.3;p.sy=.72;puff(p.x+p.w/2,p.y+p.h,4)}
  p.sx+=(1-p.sx)*.2;p.sy+=(1-p.sy)*.2;
  if(!p.onGround){ p.sy+=Math.max(-.2,Math.min(.2,-p.vy*.01))*.5; p.sx=2-p.sy; }
  if(p.onGround&&Math.abs(p.vx)>3.5&&frame%7===0)puff(p.x+p.w/2-p.face*8,p.y+p.h,1);
  if(p.star>0&&frame%3===0)particles.push({x:p.x+rnd(0,p.w),y:p.y+rnd(0,p.h),vx:rnd(-.5,.5),vy:rnd(-1,0),life:20,max:20,c:['#ffe45c','#ff8aa8','#7ad6ff','#9aff9a'][Math.floor(rnd(0,4))],r:3,g:0,star:true});
  if(p.y>ROWS*T+40)die();
  if(p.x+p.w>goalX&&p.y+p.h>goalG*T-8*T&&p.y<goalG*T+T&&!p.win){p.win=true;winT=0;score+=500;markCleared();sfx.win();sparkle(goalX,goalG*T-200,'#ff5a7a');sparkle(goalX,goalG*T-120,'#ffe45c')}
}

function killEnemy(e,pts=100){
  e.sq=1;score+=pts;sfx.stomp();addText(e.x+14,e.y-6,'+'+pts,'#fff');puff(e.x+14,e.y+e.h,6);
}

function doWarp(e){
  const p=player;
  if(e.to==='back'){if(!warpRet)return;p.x=warpRet.x;p.y=warpRet.y}
  else{
    const z=zonesById[e.id];if(!z)return;
    warpRet={x:e.x+e.w/2-p.w/2,y:p.y};
    p.x=z.spawnX;p.y=GY*T-p.h;
  }
  p.vx=0;p.vy=0;p.ride=null;fadeT=26;sfx.check();
  refreshTheme();
  cam.x=camTargetX();if(TOWER)cam.y=Math.max(0,Math.min(p.y-H*.5,ROWS*T-H));
}
function updateEnts(){
  const p=player;
  for(const e of ents){
    if(e.gone)continue;
    if(p.clock>0&&(e.t==='walker'||e.t==='bullet'||e.t==='pod'||e.t==='cannon'||e.t==='thwomp'))continue;
    if(e.t==='coin'){
      e.ph+=.12;
      if(p.magnet>0&&!p.dead){const dx=p.x+p.w/2-e.x-8,dy=p.y+p.h/2-e.y-8,d=Math.hypot(dx,dy);if(d<170&&d>1){e.x+=dx/d*5;e.y+=dy/d*5}}
      if(!p.dead&&overlap(p,e)){e.gone=true;coins++;score+=10;sfx.coin();sparkle(e.x+8,e.y+8)}
    }else if(e.t==='walker'){
      if(!e.active){ if(Math.abs(e.x-p.x)<T*17&&Math.abs(e.y-p.y)<T*16)e.active=true; else continue; }
      if(e.sq>0){e.sq++;if(e.sq>22)e.gone=true;continue}
      if(e.kind==='ghost'){
        e.ph+=.06;const dx=p.x-e.x,dy=p.y-e.y,away=(dx>0&&p.face>0)||(dx<0&&p.face<0);
        e.shy=!away;e.dir=Math.sign(dx)||1;
        if(away&&!p.dead){const d=Math.hypot(dx,dy)||1;e.x+=dx/d*1.05;e.y+=dy/d*.85}
        e.y+=Math.sin(e.ph)*.5;
      }else if(e.kind==='bat'){
        e.ph+=.12;e.dir=Math.sign(p.x-e.x)||1;
        if(e.bs===0){e.y=e.y0+Math.sin(e.ph)*2;if(e.cd>0)e.cd--;
          if(!p.dead&&e.cd<=0&&Math.abs(p.x-e.x)<T*5&&p.y>e.y&&p.y-e.y<T*9){e.bs=1;e.bt=0;e.tx=p.x;e.ty=p.y}}
        else if(e.bs===1){e.bt++;const dx=e.tx-e.x,dy=e.ty-e.y,d=Math.hypot(dx,dy)||1;e.x+=dx/d*3.2;e.y+=dy/d*3.2;if(d<6||e.bt>70)e.bs=2}
        else{const dx=e.x0-e.x,dy=e.y0-e.y,d=Math.hypot(dx,dy)||1;e.x+=dx/d*2.2;e.y+=dy/d*2.2;if(d<3){e.bs=0;e.cd=70;e.x=e.x0;e.y=e.y0}}
      }else if(e.kind==='fly'){
        e.ph+=.07;e.y=e.y0+Math.sin(e.ph)*26;e.x+=e.dir*.9;
        if(e.x>e.x0+e.rx)e.dir=-1;else if(e.x<e.x0-e.rx)e.dir=1;
      }else if(e.kind==='hop'){
        e.vy=Math.min(e.vy+.5,10);
        if(e.onGround){e.vx=0;e.hopT++;if(e.hopT>45){e.hopT=0;e.vy=-9.5;e.dir=Math.sign(p.x-e.x)||1}}
        else e.vx=e.dir*1.4;
        moveEntity(e,false);if(e.hitX)e.dir*=-1;
        if(e.y>ROWS*T+50)e.gone=true;
      }else{
        e.vx=e.dir*(e.kind==='peng'?1.7:.9);e.vy=Math.min(e.vy+.5,10);moveEntity(e,false);
        if(e.hitX)e.dir*=-1;
        if(e.y>ROWS*T+50)e.gone=true;
      }
      if(!p.dead&&!p.win&&overlap(p,e)){
        if(p.star>0)killEnemy(e,200);
        else if(p.vy>0&&p.y+p.h-e.y<20&&e.kind!=='spiny'&&e.kind!=='ghost'){
          killEnemy(e);p.vy=keys.jump?-10.5:-7;p.sx=.8;p.sy=1.25;
        }else hurt();
      }
    }else if(e.t==='warp'){
      const pc=p.x+p.w/2;
      const near=!p.dead&&!p.win&&p.onGround&&(e.kind==='pipe'?(Math.abs(p.y+p.h-e.y)<4&&pc>e.x+4&&pc<e.x+e.w-4):overlap(p,e));
      e.hint=near;
      if(near&&downEdge)doWarp(e);
    }else if(e.t==='lava'){
      if(!p.win){if(e.delay>0)e.delay--;else e.y-=e.sp}
      if(!p.dead&&!p.win&&p.y+p.h>e.y+10){shake=8;die()}
    }else if(e.t==='spring'){
      if(e.comp>0)e.comp--;
      if(!p.dead&&!p.win&&p.vy>=0&&overlap(p,{x:e.x,y:e.y-4,w:e.w,h:e.h+4})&&p.y+p.h-e.y<26){
        p.vy=-17;p.spr=true;p.onGround=false;p.ride=null;e.comp=12;p.sx=.72;p.sy=1.35;sfx.jump();puff(e.x+14,e.y+18,6);
      }
    }else if(e.t==='cannon'){
      const dxp=p.x-e.x; if(e.cd>0)e.cd--;
      e.face=dxp<0?-1:1;
      if(e.cd<=0&&!p.dead&&Math.abs(dxp)<T*13&&Math.abs(dxp)>T*3){
        e.cd=140;const d=e.face;
        ents.push({t:'bullet',x:e.x+(d>0?T:-22),y:e.y+8,w:22,h:16,vx:d*2.8,dir:d,life:420,sq:0});
        sfx.fire();puff(e.x+(d>0?T:0),e.y+16,5);
      }
    }else if(e.t==='bullet'){
      if(e.sq>0){e.sq++;e.y+=3;if(e.sq>20)e.gone=true;continue}
      e.x+=e.vx;e.life--;
      if(e.life<=0||solidAt(Math.floor((e.vx>0?e.x+e.w:e.x)/T),Math.floor((e.y+8)/T))){e.gone=true;puff(e.x,e.y+8,4);continue}
      if(!p.dead&&!p.win&&overlap(p,{x:e.x+2,y:e.y+2,w:e.w-4,h:e.h-4})){
        if(p.star>0){e.sq=1;score+=200;sfx.stomp()}
        else if(p.vy>0&&p.y+p.h-e.y<16){e.sq=1;score+=100;sfx.stomp();addText(e.x+10,e.y-6,'+100','#fff');p.vy=keys.jump?-10.5:-7;p.sx=.8;p.sy=1.25}
        else hurt();
      }
    }else if(e.t==='pod'){
      if(e.st===0){if(Math.abs(e.x-p.x)<T*14&&--e.wait<=0){e.st=1;e.vy=-15}}
      else{e.vy+=.5;e.y+=e.vy;if(e.y>=ROWS*T+10){e.y=ROWS*T+10;e.st=0;e.wait=70+Math.floor(Math.random()*40)}}
      if(!p.dead&&!p.win&&e.y<ROWS*T&&overlap(p,{x:e.x+3,y:e.y+4,w:e.w-6,h:e.h-8}))hurt();
    }else if(e.t==='belt'){
      if(!p.dead&&!p.win&&p.onGround&&!p.ride&&p.x+p.w>e.x&&p.x<e.x+e.w&&Math.abs(p.y+p.h-e.y)<3&&rectFree(p.x+e.dir*1.4,p.y,p.w,p.h))p.x+=e.dir*1.4;
    }else if(e.t==='item'){
      if(e.rise<26){e.rise+=1.6;e.y=Math.max(e.targetY,e.y-1.6);if(e.rise>=26){e.y=e.targetY;e.rise=26}}
      else if(e.kind!=='flower'){
        e.vx=e.dir*(e.kind==='star'?2.2:1.5);e.vy=Math.min(e.vy+.5,10);moveEntity(e,false);
        if(e.kind==='star'&&e.onGround)e.vy=-8;
        if(e.hitX)e.dir*=-1;
        if(e.y>ROWS*T+50)e.gone=true;
      }
      if(!p.dead&&!p.win&&e.rise>=10&&overlap(p,e)){e.gone=true;getItem(e.kind)}
    }else if(e.t==='fb'){
      e.life--;e.vy=Math.min(e.vy+.4,8);moveEntity(e,false);
      if(e.onGround)e.vy=-4.2;
      if(e.hitX||e.life<=0||Math.abs(e.x-p.x)>W){e.gone=true;puff(e.x,e.y,4);continue}
      for(const w of ents){
        if(w.t==='walker'&&!w.gone&&w.active&&!w.sq&&overlap({x:e.x-3,y:e.y-4,w:e.w+6,h:e.h+8},w)){killEnemy(w,100);e.gone=true;break}
      }
    }else if(e.t==='spike'){
      const pcx=p.x+p.w/2;
      if(e.st===0&&!p.dead&&Math.abs(pcx-(e.x+T/2))<46&&p.y+p.h<=GY*T+2){e.st=1;sfx.boom();shake=4}
      if(e.st===1&&e.h<30)e.h=Math.min(30,e.h+6);
      if(e.h>6&&!p.dead&&!p.win&&overlap(p,{x:e.x+8,y:e.y-e.h+6,w:T-16,h:Math.max(0,e.h-6)}))hurt();
    }else if(e.t==='thwomp'){
      const cx=e.x+e.w/2,pcx=p.x+p.w/2,rest=GY*T-e.h;
      if(e.st===0&&!p.dead&&Math.abs(cx-pcx)<40){e.st=1;e.vy=0}
      if(e.st===1){e.vy+=.9;e.y+=e.vy;if(e.y>=rest){e.y=rest;e.st=2;e.wait=45;shake=9;sfx.boom();puff(cx,GY*T,10)}}
      else if(e.st===2){if(--e.wait<=0)e.st=3}
      else if(e.st===3){e.y-=1.5;if(e.y<=e.y0){e.y=e.y0;e.st=0}}
      if(!p.dead&&!p.win&&overlap(p,{x:e.x+3,y:e.y+3,w:e.w-6,h:e.h-4}))hurt();
    }else if(e.t==='check'){
      if(!e.done&&p.x+p.w>e.x+10&&p.y+p.h>e.y-T*3&&p.y<e.y+e.h+T&&(checkX===null||e.x>checkX)){
        e.done=true;checkX=e.x;checkPow=p.big?(p.fire?2:1):0;prog.stage=curStage;prog.checkX=e.x;checkY=e.y+e.h-28;prog.checkY=checkY;prog.pow=checkPow;saveProg();
        sfx.check();addText(e.x+16,e.y-10,checkPow?'チェックポイント! (大きさキープ)':'チェックポイント!','#ff8aa8');sparkle(e.x+16,e.y);
      }
    }
  }
}

function updateParticles(){
  for(const q of particles){q.x+=q.vx;q.y+=q.vy;q.vy+=q.g;q.life--}
  particles=particles.filter(q=>q.life>0);
  for(const t of texts){t.y-=.6;t.life--}
  texts=texts.filter(t=>t.life>0);
  for(const k in bumps){bumps[k]++;if(bumps[k]>8)delete bumps[k]}
}

// ---------- drawing ----------
function rr(x,y,w,h,r){ctx.beginPath();ctx.roundRect(x,y,w,h,r)}

function drawBackground(){
  const g=ctx.createLinearGradient(0,0,0,H);
  g.addColorStop(0,TH.sky[0]);g.addColorStop(.7,TH.sky[1]);g.addColorStop(1,TH.sky[2]);
  ctx.fillStyle=g;ctx.fillRect(0,0,W,H);
  if(TH.stars){
    for(let i=0;i<70;i++){
      const x=((i*137.5-cam.x*.05)%W+W)%W,y=(i*53)%250,tw=.5+.5*Math.sin(frame*.05+i);
      ctx.globalAlpha=.4+tw*.6;ctx.fillStyle='#fff';ctx.fillRect(x,y,2,2);
    }
    ctx.globalAlpha=1;
  }
  if(TH.sun){
    ctx.fillStyle=TH.sun;ctx.beginPath();ctx.arc(660,70,34,0,7);ctx.fill();
    ctx.fillStyle='rgba(255,255,255,.55)';ctx.beginPath();ctx.arc(660,70,24,0,7);ctx.fill();
  }
  const towerOn=TOWER&&(state==='play'||state==='pause'||state==='over'||state==='clear');
  const hyOff=towerOn?(ROWS*T-H-cam.y)*.6:0;
  if(TH.cloud){
    ctx.save();ctx.translate(0,hyOff*.5);
    for(let i=0;i<14;i++){
      const wx=i*380+((i*97)%120), x=((wx-cam.x*.25)%(14*380)+14*380)%(14*380)-100, y=40+((i*53)%90);
      drawCloud(x,y,.8+(i%3)*.2);
    }
    ctx.restore();
  }
  if(TH.cave){
    ctx.fillStyle='#2f2840';
    for(let i=0;i<20;i++){
      const x=((i*140-cam.x*.6)%(20*140)+20*140)%(20*140)-60,h=40+(i*37)%60;
      ctx.beginPath();ctx.moveTo(x,0);ctx.lineTo(x+34,0);ctx.lineTo(x+17,h);ctx.closePath();ctx.fill();
    }
  }
  ctx.save();ctx.translate(0,hyOff);
  for(let i=0;i<16;i++){
    const x=((i*330-cam.x*.5)%(16*330)+16*330)%(16*330)-200, r=70+(i%3)*28;
    ctx.fillStyle=i%2?TH.hill[0]:TH.hill[1];
    ctx.beginPath();ctx.ellipse(x,12*T,r*1.5,r,0,Math.PI,0);ctx.fill();
    ctx.fillStyle=TH.hillDot;ctx.beginPath();ctx.arc(x-r*.4,12*T-r*.55,3,0,7);ctx.arc(x+r*.25,12*T-r*.4,3,0,7);ctx.fill();
  }
  ctx.restore();
  if(TH.snow){
    ctx.fillStyle='rgba(255,255,255,.85)';
    for(let i=0;i<45;i++){
      const x=((i*97+frame*(.3+(i%4)*.15))%W),y=((i*53+frame*(1+(i%3)*.5))%H);
      ctx.beginPath();ctx.arc(x,y,1.5+(i%3)*.5,0,7);ctx.fill();
    }
  }
}
function drawCloud(x,y,s){

}

    ctx.moveTo(x+16,y+21);ctx.lineTo(x+16,y+T);ctx.stroke();
    ctx.strokeRect(x+1,y+1,T-2,T-2);
  }else if('?MSUFEJNDZ'.includes(c)){
    ctx.fillStyle='#ffd23f';rr(x+1,y+1,T-2,T-2,5);ctx.fill();
    ctx.strokeStyle='#b97a00';ctx.lineWidth=2.5;ctx.stroke();
    ctx.fillStyle='#fff3b0';ctx.fillRect(x+5,y+5,3,3);ctx.fillRect(x+T-8,y+5,3,3);
    ctx.fillStyle='#8a5200';ctx.font=`bold 22px ${FONT}`;ctx.textAlign='center';ctx.textBaseline='middle';
    ctx.fillText('?',x+16,y+17);
  }else if(c==='u'){
    ctx.fillStyle='#b89a72';rr(x+1,y+1,T-2,T-2,5);ctx.fill();
    ctx.strokeStyle='#7b6244';ctx.lineWidth=2.5;ctx.stroke();
    ctx.fillStyle='#9c805c';ctx.fillRect(x+5,y+5,3,3);ctx.fillRect(x+T-8,y+5,3,3);
  }else if(c==='='){
    ctx.fillStyle='#dccaa6';ctx.fillRect(x,y,T,T);
    ctx.fillStyle='#f2e6cc';ctx.fillRect(x,y,T,4);ctx.fillRect(x,y,4,T);
    ctx.fillStyle='#a8946c';ctx.fillRect(x,y+T-4,T,4);ctx.fillRect(x+T-4,y,4,T);
    ctx.strokeStyle='#6f5e40';ctx.lineWidth=1.5;ctx.strokeRect(x+.75,y+.75,T-1.5,T-1.5);
  }else if('abcd'.includes(c)){
    const left=c==='a'||c==='c',top=c==='a'||c==='b';
    ctx.fillStyle='#3fb950';ctx.fillRect(x,y,T,T);
    ctx.fillStyle='#7ee08a';ctx.fillRect(left?x+5:x+T-12,y,5,T);
    ctx.fillStyle='#2a8a3a';ctx.fillRect(left?x:x+T-5,y,5,T);
    if(top){ctx.fillStyle='#2f9e44';ctx.fillRect(x,y,T,8);ctx.fillStyle='#7ee08a';ctx.fillRect(left?x+5:x+T-12,y,5,8)}
    ctx.strokeStyle='#1f5f2a';ctx.lineWidth=2;
    ctx.beginPath();ctx.moveTo(left?x+1:x+T-1,y);ctx.lineTo(left?x+1:x+T-1,y+T);
    if(top){ctx.moveTo(x,y+1);ctx.lineTo(x+T,y+1);ctx.moveTo(x,y+8);ctx.lineTo(x+T,y+8)}
    ctx.stroke();
  }
}

function drawChar(px,py,s,P){
  const f=P.face||1,run=P.onGround&&Math.abs(P.vx)>.3;
  const bandC=P.fire?'#ff9f1c':'#e8344e';
  ctx.save();ctx.translate(px,py);ctx.scale(s,s);
  if(P.star){
    const hue=(P.t*12)%360;
    const g=ctx.createRadialGradient(0,-16,6,0,-16,34);
    g.addColorStop(0,`hsla(${hue},100%,70%,.55)`);g.addColorStop(1,`hsla(${hue},100%,70%,0)`);
    ctx.fillStyle=g;ctx.beginPath();ctx.arc(0,-16,34,0,7);ctx.fill();
  }
  if(P.rot){ctx.translate(0,-16);ctx.rotate(P.rot);ctx.translate(0,16)}
  ctx.scale(P.sx||1,P.sy||1);
  ctx.lineJoin='round';ctx.lineCap='round';
  const ph=P.t*(.25+Math.abs(P.vx)*.06);
  ctx.fillStyle='#ff9a5c';ctx.strokeStyle=OUT;ctx.lineWidth=2.5;
  for(const k of [-1,1]){
    let fy=0,fx=k*8;
    if(!P.onGround){fy=-4;fx=k*9}
    else if(run){fy=-Math.max(0,Math.sin(ph+(k>0?0:Math.PI)))*5}
    ctx.beginPath();ctx.ellipse(fx,-3+fy,6,4.5,0,0,7);ctx.fill();ctx.stroke();
  }
  const bx=-f*14,by=-24,flap=Math.sin(P.t*.35)*3+(run?-3:0)+(P.vy<-1?5:P.vy>2?-5:0);
  ctx.fillStyle=bandC;ctx.lineWidth=2;
  for(const k of [-1,1]){
    ctx.beginPath();ctx.moveTo(bx,by);
    ctx.quadraticCurveTo(bx-f*10,by+k*3+flap*.4,bx-f*(19+Math.abs(P.vx)*1.5),by+k*7+flap);
    ctx.lineTo(bx-f*5,by+k*1);ctx.closePath();ctx.fill();ctx.stroke();
  }
  const g=ctx.createRadialGradient(-5,-25,2,0,-16,20);g.addColorStop(0,'#ffffff');g.addColorStop(1,'#ffe6cf');
  ctx.fillStyle=g;ctx.beginPath();ctx.ellipse(0,-16,17,16,0,0,7);ctx.fill();
  ctx.save();ctx.beginPath();ctx.ellipse(0,-16,17,16,0,0,7);ctx.clip();
  ctx.strokeStyle=bandC;ctx.lineWidth=6;ctx.beginPath();ctx.moveTo(-18,-25);ctx.quadraticCurveTo(0,-20,18,-25);ctx.stroke();
  ctx.strokeStyle='#fff';ctx.lineWidth=1.5;ctx.setLineDash([3,4]);ctx.beginPath();ctx.moveTo(-18,-25);ctx.quadraticCurveTo(0,-20,18,-25);ctx.stroke();ctx.setLineDash([]);
  ctx.restore();
  ctx.strokeStyle=OUT;ctx.lineWidth=3;ctx.beginPath();ctx.ellipse(0,-16,17,16,0,0,7);ctx.stroke();
  const fx=f*3+(P.vx||0)*.25;
  ctx.fillStyle='rgba(255,130,150,.75)';
  ctx.beginPath();ctx.ellipse(fx-11.5,-9.5,4,2.6,0,0,7);ctx.ellipse(fx+11.5,-9.5,4,2.6,0,0,7);ctx.fill();
  if(P.dead){
    ctx.strokeStyle=OUT;ctx.lineWidth=2.2;ctx.beginPath();
    for(const k of [-1,1]){const ex=fx+k*6.5;ctx.moveTo(ex-3,-19);ctx.lineTo(ex+3,-13);ctx.moveTo(ex+3,-19);ctx.lineTo(ex-3,-13)}
    ctx.stroke();
    ctx.fillStyle='#7a2330';ctx.beginPath();ctx.ellipse(fx,-7,3,3.6,0,0,7);ctx.fill();
  }else{
    for(const k of [-1,1]){
      const ex=fx+k*6.5;
      if(P.blink>0){ctx.strokeStyle=OUT;ctx.lineWidth=2;ctx.beginPath();ctx.arc(ex,-16,3,.2,Math.PI-.2);ctx.stroke()}
      else{
        ctx.fillStyle='#2b1d1d';ctx.beginPath();ctx.ellipse(ex,-15.5,3.4,5,0,0,7);ctx.fill();
        ctx.fillStyle='#fff';ctx.beginPath();ctx.arc(ex-1,-17.5,1.7,0,7);ctx.arc(ex+1,-13.5,.8,0,7);ctx.fill();
      }
    }
    ctx.strokeStyle=OUT;ctx.lineWidth=1.8;
    if((!P.onGround&&P.vy<0)||P.star){ctx.fillStyle='#7a2330';ctx.beginPath();ctx.ellipse(fx,-8,2.3,3,0,0,7);ctx.fill();ctx.stroke()}
    else{ctx.beginPath();ctx.moveTo(fx-3.5,-8.5);ctx.quadraticCurveTo(fx-1.7,-5.5,fx,-8.5);ctx.quadraticCurveTo(fx+1.7,-5.5,fx+3.5,-8.5);ctx.stroke()}
  }
  ctx.restore();
}

function drawWalker(e){
  const x=e.x+e.w/2,y=e.y+e.h,kind=e.kind||'walk';
  const pal=kind==='hop'?{body:'#7ad06a',belly:'#d2f5b0',foot:'#4f9a46'}
    :kind==='fly'?{body:'#a98af5',belly:'#e0d4ff',foot:'#7b5fd0'}
    :kind==='spiny'?{body:'#e8584a',belly:'#ffb0a0',foot:'#a8352c'}
    :(TH.walkPal||{body:'#c98a56',belly:'#e8b47e',foot:'#8a5a38'});
  ctx.save();ctx.translate(x,y);ctx.lineJoin='round';
  if(e.sq>0){
    ctx.fillStyle=pal.body;ctx.strokeStyle=OUT;ctx.lineWidth=2.5;
    ctx.beginPath();ctx.ellipse(0,-4,17,5,0,0,7);ctx.fill();ctx.stroke();
    ctx.strokeStyle=OUT;ctx.lineWidth=2;ctx.beginPath();ctx.moveTo(-7,-6);ctx.lineTo(-3,-3);ctx.moveTo(-3,-6);ctx.lineTo(-7,-3);ctx.moveTo(3,-6);ctx.lineTo(7,-3);ctx.moveTo(7,-6);ctx.lineTo(3,-3);ctx.stroke();
    ctx.restore();return;
  }
  if(kind==='ghost'){
    ctx.globalAlpha=e.shy?.55:.95;
    ctx.fillStyle='#f4f4ff';ctx.strokeStyle=OUT;ctx.lineWidth=2.5;
    ctx.beginPath();ctx.moveTo(-15,-4);ctx.quadraticCurveTo(-17,-30,0,-30);ctx.quadraticCurveTo(17,-30,15,-4);
    ctx.quadraticCurveTo(10,2,7,-4);ctx.quadraticCurveTo(3,3,0,-3);ctx.quadraticCurveTo(-3,3,-7,-4);ctx.quadraticCurveTo(-10,2,-15,-4);ctx.closePath();ctx.fill();ctx.stroke();
    if(e.shy){ctx.beginPath();ctx.ellipse(-6,-17,5,4,0,0,7);ctx.ellipse(6,-17,5,4,0,0,7);ctx.fillStyle='#e0e0f5';ctx.fill();ctx.stroke()}
    else{ctx.fillStyle='#2b1d1d';ctx.beginPath();ctx.ellipse(-5,-18,2.4,3.6,0,0,7);ctx.ellipse(5,-18,2.4,3.6,0,0,7);ctx.fill();
      ctx.strokeStyle='#c22';ctx.lineWidth=2;ctx.beginPath();ctx.ellipse(0,-10,4,3,0,0,7);ctx.stroke()}
    ctx.globalAlpha=1;ctx.restore();return;
  }
  if(kind==='bat'){
    const fl=Math.sin(frame*.5)*9;
    ctx.fillStyle='#5a4a8a';ctx.strokeStyle=OUT;ctx.lineWidth=2.5;
    for(const k of [-1,1]){ctx.beginPath();ctx.moveTo(k*6,-14);ctx.lineTo(k*26,-14-fl);ctx.lineTo(k*22,-6-fl*.4);ctx.lineTo(k*16,-9);ctx.lineTo(k*12,-3);ctx.lineTo(k*6,-6);ctx.closePath();ctx.fill();ctx.stroke()}
    ctx.beginPath();ctx.ellipse(0,-11,10,10,0,0,7);ctx.fill();ctx.stroke();
    ctx.beginPath();ctx.moveTo(-8,-18);ctx.lineTo(-6,-26);ctx.lineTo(-2,-20);ctx.moveTo(8,-18);ctx.lineTo(6,-26);ctx.lineTo(2,-20);ctx.fill();ctx.stroke();
    ctx.fillStyle='#fff';ctx.beginPath();ctx.arc(-4,-12,3,0,7);ctx.arc(4,-12,3,0,7);ctx.fill();
    ctx.fillStyle='#d11';ctx.beginPath();ctx.arc(-4,-12,1.4,0,7);ctx.arc(4,-12,1.4,0,7);ctx.fill();
    ctx.fillStyle='#fff';ctx.beginPath();ctx.moveTo(-3,-6);ctx.lineTo(-2,-3);ctx.lineTo(-1,-6);ctx.moveTo(1,-6);ctx.lineTo(2,-3);ctx.lineTo(3,-6);ctx.fill();
    ctx.restore();return;
  }
  if(kind==='peng'){
    const wd=Math.sin(frame*.3)*3;
    ctx.fillStyle='#ff9a2a';ctx.strokeStyle=OUT;ctx.lineWidth=2.2;
    for(const k of [-1,1]){ctx.beginPath();ctx.ellipse(k*7+wd*k*.4,-2,6,3.5,0,0,7);ctx.fill();ctx.stroke()}
    ctx.fillStyle='#34456b';ctx.beginPath();ctx.ellipse(0,-14,14,14,0,0,7);ctx.fill();ctx.stroke();
    ctx.fillStyle='#fff';ctx.beginPath();ctx.ellipse(0,-10,9,10,0,0,7);ctx.fill();
    ctx.fillStyle='#34456b';for(const k of [-1,1]){ctx.beginPath();ctx.ellipse(k*15,-12,4,8,k*.3,0,7);ctx.fill();ctx.stroke()}
    const d=e.dir||-1;ctx.fillStyle='#fff';ctx.beginPath();ctx.arc(-5+d,-19,3.6,0,7);ctx.arc(5+d,-19,3.6,0,7);ctx.fill();
    ctx.fillStyle='#2b1d1d';ctx.beginPath();ctx.arc(-5+d*2,-19,1.7,0,7);ctx.arc(5+d*2,-19,1.7,0,7);ctx.fill();
    ctx.fillStyle='#ff9a2a';ctx.strokeStyle=OUT;ctx.lineWidth=1.8;ctx.beginPath();ctx.moveTo(-3+d*2,-15);ctx.lineTo(3+d*2,-15);ctx.lineTo(d*3,-11);ctx.closePath();ctx.fill();ctx.stroke();
    ctx.restore();return;
  }
  const w=Math.sin(frame*.25*(e.dir||1));
  if(kind==='fly'){
    const fl=Math.sin(frame*.4)*8;
    ctx.fillStyle='#fff';ctx.strokeStyle=OUT;ctx.lineWidth=2;
    for(const k of [-1,1]){ctx.beginPath();ctx.ellipse(k*16,-18-fl*.6,9,5+Math.abs(fl)*.3,k*(.5+fl*.03),0,7);ctx.fill();ctx.stroke()}
  }
  ctx.fillStyle=pal.foot;ctx.strokeStyle=OUT;ctx.lineWidth=2.5;
  for(const k of [-1,1]){ctx.beginPath();ctx.ellipse(k*8,-2-(kind==='hop'&&!e.onGround?4:Math.max(0,w*k)*3),6,4,0,0,7);ctx.fill();ctx.stroke()}
  ctx.fillStyle=pal.body;ctx.beginPath();ctx.ellipse(0,-13,16,13,0,0,7);ctx.fill();ctx.stroke();
  if(kind==='spiny'){ctx.fillStyle='#fff3d0';ctx.lineWidth=2;for(let i=-2;i<=2;i++){ctx.beginPath();ctx.moveTo(i*6-4,-22+Math.abs(i));ctx.lineTo(i*6,-34+Math.abs(i)*2);ctx.lineTo(i*6+4,-22+Math.abs(i));ctx.closePath();ctx.fill();ctx.stroke()}}
  ctx.fillStyle=pal.belly;ctx.beginPath();ctx.ellipse(0,-8,10,6,0,0,7);ctx.fill();
  const d=e.dir||-1;
  for(const k of [-1,1]){
    const ex=k*6+d*1.5;
    ctx.fillStyle='#fff';ctx.beginPath();ctx.arc(ex,-14,4,0,7);ctx.fill();ctx.lineWidth=1.5;ctx.stroke();
    ctx.fillStyle='#2b1d1d';ctx.beginPath();ctx.arc(ex+d*1.2,-13.5,2,0,7);ctx.fill();
  }
  ctx.strokeStyle=OUT;ctx.lineWidth=2.2;ctx.beginPath();
  ctx.moveTo(-11,-22);ctx.lineTo(-2,-18);ctx.moveTo(11,-22);ctx.lineTo(2,-18);ctx.stroke();
  ctx.lineWidth=1.8;ctx.beginPath();ctx.moveTo(-3,-7);ctx.quadraticCurveTo(0,-9.5,3,-7);ctx.stroke();
  if(kind==='hop'){ctx.lineWidth=2;ctx.beginPath();ctx.moveTo(-5,-25);ctx.quadraticCurveTo(-8,-34,-3,-34);ctx.moveTo(5,-25);ctx.quadraticCurveTo(8,-34,3,-34);ctx.stroke()}
  ctx.restore();
}

function drawItem(e){
  const cx=e.x+e.w/2,by=e.y+e.h;
  ctx.save();ctx.translate(cx,by);ctx.lineJoin='round';ctx.strokeStyle=OUT;ctx.lineWidth=2.5;
  if(e.kind==='mush'||e.kind==='life'){
    const cap=e.kind==='life'?'#5ed46a':'#ff4d6d';
    ctx.fillStyle='#fff3dc';rr(-8,-12,16,12,4);ctx.fill();ctx.stroke();
    ctx.fillStyle=cap;ctx.beginPath();ctx.ellipse(0,-14,13,11,0,Math.PI,0);ctx.closePath();ctx.fill();ctx.stroke();
    ctx.fillStyle='#fff';ctx.beginPath();ctx.arc(-6,-19,3,0,7);ctx.arc(5,-20,3.4,0,7);ctx.arc(0,-14.5,2.2,0,7);ctx.fill();
    ctx.fillStyle='#2b1d1d';ctx.beginPath();ctx.ellipse(-3.2,-7,1.5,2.2,0,0,7);ctx.ellipse(3.2,-7,1.5,2.2,0,0,7);ctx.fill();
    if(e.kind==='life'){ctx.fillStyle='#fff';ctx.strokeStyle=OUT;ctx.lineWidth=3;ctx.font=`bold 11px ${FONT}`;ctx.textAlign='center';ctx.strokeText('1UP',0,-30);ctx.fillText('1UP',0,-30)}
  }else if(e.kind==='star'){
    const r=13,bob=Math.sin(frame*.2)*2;
    ctx.translate(0,-13+bob);ctx.rotate(Math.sin(frame*.1)*.2);
    ctx.fillStyle='#ffe45c';ctx.beginPath();
    for(let i=0;i<10;i++){const a=-Math.PI/2+i*Math.PI/5,rad=i%2?r*.5:r;ctx.lineTo(Math.cos(a)*rad,Math.sin(a)*rad)}
    ctx.closePath();ctx.fill();ctx.stroke();
    ctx.fillStyle='#2b1d1d';ctx.beginPath();ctx.ellipse(-3.2,-1,1.4,2.3,0,0,7);ctx.ellipse(3.2,-1,1.4,2.3,0,0,7);ctx.fill();
    ctx.lineWidth=1.5;ctx.beginPath();ctx.moveTo(-2,3.5);ctx.quadraticCurveTo(0,5.5,2,3.5);ctx.stroke();
  }else if(e.kind==='flower'){
    ctx.strokeStyle='#2a8a3a';ctx.lineWidth=3;ctx.beginPath();ctx.moveTo(0,0);ctx.lineTo(0,-11);ctx.stroke();
    ctx.fillStyle='#5ed46a';ctx.strokeStyle=OUT;ctx.lineWidth=2;ctx.beginPath();ctx.ellipse(-6,-5,5,3,-.5,0,7);ctx.ellipse(6,-5,5,3,.5,0,7);ctx.fill();ctx.stroke();
    ctx.translate(0,-17);
    ctx.fillStyle='#ff9f1c';
    for(let i=0;i<6;i++){const a=i/6*6.283;ctx.beginPath();ctx.arc(Math.cos(a)*8,Math.sin(a)*8,5,0,7);ctx.fill();ctx.stroke()}
    ctx.fillStyle='#fff3b0';ctx.beginPath();ctx.arc(0,0,7,0,7);ctx.fill();ctx.stroke();
    ctx.fillStyle='#2b1d1d';ctx.beginPath();ctx.ellipse(-2.6,-.5,1.2,2,0,0,7);ctx.ellipse(2.6,-.5,1.2,2,0,0,7);ctx.fill();
  }else if(e.kind==='shield'){
    ctx.translate(0,-14+Math.sin(frame*.15)*2);ctx.fillStyle='#7ad6ff';
    ctx.beginPath();ctx.moveTo(-11,-10);ctx.quadraticCurveTo(0,-15,11,-10);ctx.quadraticCurveTo(12,6,0,13);ctx.quadraticCurveTo(-12,6,-11,-10);ctx.closePath();ctx.fill();ctx.stroke();
    ctx.fillStyle='#fff';ctx.beginPath();ctx.arc(-3,-4,3,0,7);ctx.fill();
  }else if(e.kind==='wing'){
    ctx.translate(0,-13+Math.sin(frame*.2)*3);ctx.fillStyle='#fff';
    for(const k of [-1,1]){ctx.beginPath();ctx.moveTo(k*2,2);ctx.quadraticCurveTo(k*16,-14,k*14,-2);ctx.quadraticCurveTo(k*18,2,k*10,6);ctx.quadraticCurveTo(k*8,10,k*2,8);ctx.closePath();ctx.fill();ctx.stroke()}
  }else if(e.kind==='magnet'){
    ctx.translate(0,-12);ctx.lineWidth=7;ctx.strokeStyle=OUT;ctx.beginPath();ctx.arc(0,0,9,Math.PI,0);ctx.lineTo(9,10);ctx.moveTo(-9,0);ctx.lineTo(-9,10);ctx.stroke();
    ctx.lineWidth=3.5;ctx.strokeStyle='#ff4d4d';ctx.beginPath();ctx.arc(0,0,9,Math.PI,Math.PI*1.5);ctx.moveTo(-9,0);ctx.lineTo(-9,10);ctx.stroke();
    ctx.strokeStyle='#4d7dff';ctx.beginPath();ctx.arc(0,0,9,Math.PI*1.5,Math.PI*2);ctx.lineTo(9,10);ctx.stroke();
    ctx.fillStyle='#fff';ctx.fillRect(-12,9,6,4);ctx.fillRect(6,9,6,4);
  }else if(e.kind==='dash'){
    ctx.translate(0,-12);ctx.fillStyle='#ff8a2a';
    ctx.beginPath();ctx.moveTo(-9,-10);ctx.lineTo(3,-10);ctx.lineTo(4,0);ctx.lineTo(13,4);ctx.lineTo(13,10);ctx.lineTo(-9,10);ctx.closePath();ctx.fill();ctx.stroke();
    ctx.fillStyle='#ffe45c';ctx.beginPath();ctx.moveTo(-2,-6);ctx.lineTo(-6,2);ctx.lineTo(-2,2);ctx.lineTo(-4,8);ctx.lineTo(3,-1);ctx.lineTo(-1,-1);ctx.closePath();ctx.fill();
  }else if(e.kind==='clock'){
    ctx.translate(0,-13);ctx.fillStyle='#fff';ctx.beginPath();ctx.arc(0,0,12,0,7);ctx.fill();ctx.stroke();
    ctx.strokeStyle=OUT;ctx.lineWidth=2.2;ctx.beginPath();ctx.moveTo(0,0);ctx.lineTo(0,-8);ctx.moveTo(0,0);ctx.lineTo(6,2);ctx.stroke();
    ctx.fillStyle='#ff5a7a';ctx.beginPath();ctx.arc(-7,-12,4,0,7);ctx.arc(7,-12,4,0,7);ctx.fill();
  }
  ctx.restore();
}

function drawEnt(e){
  if(e.gone)return;
  if(e.t==='coin'){
    const w=Math.abs(Math.cos(e.ph))*7+1.5,cx=e.x+8,cy=e.y+8+Math.sin(e.ph*.7)*2;
    ctx.fillStyle='#ffd23f';ctx.strokeStyle='#b97a00';ctx.lineWidth=2;
    ctx.beginPath();ctx.ellipse(cx,cy,w,8,0,0,7);ctx.fill();ctx.stroke();
    ctx.fillStyle='#fff3b0';ctx.beginPath();ctx.ellipse(cx-w*.3,cy-2,w*.25,3,0,0,7);ctx.fill();
  }else if(e.t==='walker'){drawWalker(e)}
  else if(e.t==='item'){drawItem(e)}
  else if(e.t==='fb'){
    ctx.save();ctx.translate(e.x+5,e.y+5);
    const g=ctx.createRadialGradient(0,0,1,0,0,9);g.addColorStop(0,'#fff6b0');g.addColorStop(.5,'#ffb347');g.addColorStop(1,'rgba(255,100,40,0)');
    ctx.fillStyle=g;ctx.beginPath();ctx.arc(0,0,9,0,7);ctx.fill();
    ctx.fillStyle='#ff7a2f';ctx.strokeStyle=OUT;ctx.lineWidth=1.5;ctx.beginPath();ctx.arc(0,0,5,0,7);ctx.fill();ctx.stroke();
    ctx.restore();
  }
  else if(e.t==='lift'){
    ctx.save();ctx.translate(e.x,e.y);
    const dropK=e.kind==='drop';
    ctx.fillStyle=dropK?'#f0a8a0':'#d9a86a';rr(0,0,e.w,e.h,6);ctx.fill();ctx.strokeStyle=OUT;ctx.lineWidth=2.5;ctx.stroke();
    ctx.fillStyle=dropK?'#ffd0ca':'#f0c98e';ctx.fillRect(4,2,e.w-8,3);
    ctx.fillStyle=OUT;for(let x=10;x<e.w-6;x+=e.w>70?24:30){ctx.beginPath();ctx.arc(x,9,1.6,0,7);ctx.fill()}
    ctx.restore();
  }
  else if(e.t==='warp'){
    if(e.kind==='door'){
      ctx.fillStyle='#8a5a38';ctx.strokeStyle=OUT;ctx.lineWidth=3;rr(e.x,e.y,e.w,e.h,[14,14,2,2]);ctx.fill();ctx.stroke();
      ctx.fillStyle='#a8723e';rr(e.x+4,e.y+6,e.w-8,e.h-10,[10,10,2,2]);ctx.fill();
      ctx.fillStyle='#ffd23f';ctx.beginPath();ctx.arc(e.x+e.w-9,e.y+e.h/2+4,3,0,7);ctx.fill();
    }
    if(e.hint)outlinedText('▼',e.x+e.w/2,e.y-(e.kind==='door'?10:34)+Math.sin(frame*.2)*3,22,'#ffe45c',OUT,5);
  }else if(e.t==='lava'){
    const col=e.kind==='water'?['#4aa8e8','#8fd6ff','#2a78c0']:e.kind==='poison'?['#9a5ad6','#d0a0ff','#6a3a9a']:['#ff6a2a','#ffc060','#c8381a'];
    const top=e.y,bot=ROWS*T+120;
    ctx.fillStyle=col[0];ctx.beginPath();ctx.moveTo(-40+cam.x-100,bot);
    for(let x=cam.x-100;x<=cam.x+W+100;x+=16)ctx.lineTo(x,top+Math.sin(x*.05+frame*.08)*4);
    ctx.lineTo(cam.x+W+100,bot);ctx.closePath();ctx.fill();
    ctx.fillStyle=col[1];ctx.globalAlpha=.7;ctx.beginPath();
    for(let x=cam.x-100;x<=cam.x+W+100;x+=16)ctx.lineTo(x,top+Math.sin(x*.05+frame*.08)*4);
    for(let x=cam.x+W+100;x>=cam.x-100;x-=16)ctx.lineTo(x,top+10+Math.sin(x*.05+frame*.08)*4);
    ctx.closePath();ctx.fill();ctx.globalAlpha=1;
    ctx.fillStyle=col[2];for(let i=0;i<7;i++){const bx=cam.x+((i*137+frame*.4)%W),by=top+20+((i*53+frame)%60);ctx.beginPath();ctx.arc(bx,by,3+(i%3),0,7);ctx.fill()}
  }
  else if(e.t==='spring'){
    const h=e.comp>0?9:19,y0=e.y+20;
    ctx.strokeStyle=OUT;ctx.lineWidth=2.5;ctx.fillStyle='#8a8fa0';rr(e.x+2,y0-5,e.w-4,5,2);ctx.fill();ctx.stroke();
    ctx.strokeStyle='#cfd4e0';ctx.lineWidth=3;ctx.beginPath();ctx.moveTo(e.x+6,y0-5);
    for(let i=1;i<=4;i++)ctx.lineTo(e.x+(i%2?22:6),y0-5-(h-8)*i/4);ctx.stroke();
    ctx.fillStyle='#ff5a7a';ctx.strokeStyle=OUT;ctx.lineWidth=2.5;rr(e.x,y0-h-4,e.w,7,3);ctx.fill();ctx.stroke();
  }else if(e.t==='cannon'){
    const d=e.face||-1;
    ctx.fillStyle='#4a4f66';ctx.strokeStyle=OUT;ctx.lineWidth=3;rr(e.x+1,e.y+3,30,29,6);ctx.fill();ctx.stroke();
    ctx.fillStyle='#2f3347';ctx.beginPath();ctx.arc(e.x+(d>0?29:3),e.y+16,8,0,7);ctx.fill();ctx.stroke();
    ctx.fillStyle='#fff';ctx.beginPath();ctx.arc(e.x+14,e.y+13,5,0,7);ctx.fill();
    ctx.fillStyle='#d11';ctx.beginPath();ctx.arc(e.x+14+d*1.5,e.y+13,2.4,0,7);ctx.fill();
    ctx.fillStyle='#6a708a';ctx.fillRect(e.x+5,e.y+6,22,3);
  }else if(e.t==='bullet'){
    ctx.save();ctx.translate(e.x+e.w/2,e.y+e.h/2);ctx.scale(e.dir,1);
    ctx.fillStyle='#2b2e3d';ctx.strokeStyle=OUT;ctx.lineWidth=2.5;
    ctx.beginPath();ctx.moveTo(-11,-8);ctx.lineTo(3,-8);ctx.quadraticCurveTo(13,-8,13,0);ctx.quadraticCurveTo(13,8,3,8);ctx.lineTo(-11,8);ctx.closePath();ctx.fill();ctx.stroke();
    ctx.fillStyle='#fff';ctx.beginPath();ctx.arc(4,-2,3.5,0,7);ctx.fill();
    ctx.fillStyle='#d11';ctx.beginPath();ctx.arc(5,-2,1.6,0,7);ctx.fill();
    ctx.strokeStyle='#ff9a4a';ctx.lineWidth=2;ctx.beginPath();ctx.moveTo(-12,-3);ctx.lineTo(-17-Math.random()*4,-3);ctx.moveTo(-12,3);ctx.lineTo(-16-Math.random()*4,3);ctx.stroke();
    ctx.restore();
  }else if(e.t==='pod'){
    if(e.y>=ROWS*T)return;
    const cx=e.x+e.w/2,cy=e.y+e.h/2;
    const g=ctx.createRadialGradient(cx,cy,2,cx,cy,22);g.addColorStop(0,'rgba(255,220,120,.9)');g.addColorStop(1,'rgba(255,80,30,0)');
    ctx.fillStyle=g;ctx.beginPath();ctx.arc(cx,cy,22,0,7);ctx.fill();
    ctx.fillStyle='#ff6a2a';ctx.strokeStyle=OUT;ctx.lineWidth=2.5;ctx.beginPath();ctx.arc(cx,cy,11,0,7);ctx.fill();ctx.stroke();
    ctx.fillStyle='#fff';ctx.beginPath();ctx.arc(cx-4,cy-2,3,0,7);ctx.arc(cx+4,cy-2,3,0,7);ctx.fill();
    ctx.fillStyle='#2b1d1d';ctx.beginPath();ctx.arc(cx-4,cy-1,1.4,0,7);ctx.arc(cx+4,cy-1,1.4,0,7);ctx.fill();
    ctx.strokeStyle=OUT;ctx.lineWidth=1.8;ctx.beginPath();ctx.moveTo(cx-7,cy-7);ctx.lineTo(cx-2,cy-4);ctx.moveTo(cx+7,cy-7);ctx.lineTo(cx+2,cy-4);ctx.stroke();
  }else if(e.t==='belt'){
    ctx.fillStyle='#555a6e';ctx.fillRect(e.x,e.y,e.w,8);ctx.fillStyle='#ffd23f';
    const off=((frame*1.4*e.dir)%16+16)%16;
    for(let x=-16;x<e.w;x+=16){const bx=e.x+x+off;if(bx<e.x||bx+10>e.x+e.w)continue;ctx.beginPath();
      if(e.dir>0){ctx.moveTo(bx,e.y+1);ctx.lineTo(bx+8,e.y+4);ctx.lineTo(bx,e.y+7)}else{ctx.moveTo(bx+8,e.y+1);ctx.lineTo(bx,e.y+4);ctx.lineTo(bx+8,e.y+7)}
      ctx.closePath();ctx.fill()}
    ctx.strokeStyle=OUT;ctx.lineWidth=2;ctx.strokeRect(e.x,e.y,e.w,8);
  }
  else if(e.t==='spike'){
    const tip=e.h>0?e.h:3;
    ctx.fillStyle=e.h>0?'#dfe6ee':'#9aa6b4';ctx.strokeStyle=OUT;ctx.lineWidth=2;
    for(let i=0;i<3;i++){
      const bx=e.x+4+i*8;
      ctx.beginPath();ctx.moveTo(bx,e.y+1);ctx.lineTo(bx+4,e.y-tip);ctx.lineTo(bx+8,e.y+1);ctx.closePath();
      if(e.h>0||i===1){ctx.fill();ctx.stroke()}
    }
  }else if(e.t==='thwomp'){
    ctx.save();ctx.translate(e.x,e.y);
    ctx.fillStyle='#8892a6';rr(0,0,e.w,e.h,6);ctx.fill();ctx.strokeStyle=OUT;ctx.lineWidth=3;ctx.stroke();
    ctx.fillStyle='#a7b0c2';ctx.fillRect(4,4,e.w-8,5);
    const ang=e.st===1||e.st===2;
    ctx.fillStyle='#fff';ctx.beginPath();ctx.arc(10,17,5,0,7);ctx.arc(26,17,5,0,7);ctx.fill();
    ctx.fillStyle='#d11';ctx.beginPath();ctx.arc(10,ang?19:18,2.4,0,7);ctx.arc(26,ang?19:18,2.4,0,7);ctx.fill();
    ctx.strokeStyle=OUT;ctx.lineWidth=3;ctx.beginPath();
    if(ang){ctx.moveTo(3,9);ctx.lineTo(14,14);ctx.moveTo(33,9);ctx.lineTo(22,14)}
    else{ctx.moveTo(4,11);ctx.lineTo(14,13);ctx.moveTo(32,11);ctx.lineTo(22,13)}
    ctx.stroke();
    ctx.lineWidth=2.5;ctx.beginPath();
    if(ang){ctx.moveTo(10,30);ctx.lineTo(14,26);ctx.lineTo(18,30);ctx.lineTo(22,26);ctx.lineTo(26,30)}
    else{ctx.moveTo(11,28);ctx.lineTo(25,28)}
    ctx.stroke();
    ctx.restore();
  }else if(e.t==='check'){
    ctx.strokeStyle='#fff';ctx.lineWidth=3;ctx.beginPath();ctx.moveTo(e.x+10,e.y+64);ctx.lineTo(e.x+10,e.y);ctx.stroke();
    ctx.strokeStyle=OUT;ctx.lineWidth=1;ctx.stroke();
    const wv=Math.sin(frame*.15)*3;
    ctx.fillStyle=e.done?'#ff8aa8':'#c9c9d6';ctx.strokeStyle=OUT;ctx.lineWidth=2;
    ctx.beginPath();ctx.moveTo(e.x+11,e.y+2);ctx.quadraticCurveTo(e.x+22,e.y+6+wv,e.x+30,e.y+8);ctx.quadraticCurveTo(e.x+22,e.y+14-wv,e.x+11,e.y+16);ctx.closePath();ctx.fill();ctx.stroke();
  }
}

function drawWorld(){
  ctx.save();
  let sx=0,sy=0; if(shake>0){sx=rnd(-shake,shake)*.5;sy=rnd(-shake,shake)*.5}
  const cx=Math.round(cam.x),cy=Math.round(cam.y);
  ctx.translate(-cx+sx,-cy+sy);
  const x0=Math.floor(cx/T),x1=x0+Math.ceil(W/T)+1;
  for(const e of ents)if(e.t==='item')drawEnt(e);   // ブロックの後ろから出てくる
  const y0=Math.max(0,Math.floor(cy/T)-1),y1=Math.min(ROWS-1,y0+Math.ceil(H/T)+2);
  for(let ty=y0;ty<=y1;ty++)for(let tx=x0;tx<=x1;tx++){
    const c=tileAt(tx,ty); if(c!==' '&&c!=='H')drawTile(c,tx,ty,tx*T,ty*T);
  }
  drawGoal();
  for(const e of ents)if(e.t!=='item'&&(e.t!=='walker'||e.active||e.sq))drawEnt(e);
  if(player&&!(player.inv>0&&frame%6<3)){
    const p=player;
    drawChar(p.x+p.w/2,p.y+p.h+1,p.big?1.4:1,{face:p.face,vx:p.vx,vy:p.vy,onGround:p.onGround,t:p.t,sx:p.sx,sy:p.sy,dead:p.dead,blink:p.blink,rot:p.rot,fire:p.fire,star:p.star>120||(p.star>0&&frame%4<2)});
  }
  if(player&&!player.dead){
    const p=player,pcx=p.x+p.w/2,pcy=p.y+p.h/2;
    if(p.shield){ctx.strokeStyle='rgba(122,214,255,.9)';ctx.fillStyle='rgba(122,214,255,.22)';ctx.lineWidth=3;ctx.beginPath();ctx.arc(pcx,pcy,p.h*.8+Math.sin(frame*.2)*1.5,0,7);ctx.fill();ctx.stroke()}
    if(p.wing>0&&(p.wing>180||frame%8<4)){ctx.fillStyle='#fff';ctx.strokeStyle=OUT;ctx.lineWidth=2;const fl=Math.sin(frame*.3)*5;
      for(const k of [-1,1]){ctx.beginPath();ctx.ellipse(pcx-k*(p.w/2+6)*(p.face>0?1:1),pcy-4,9,5+Math.abs(fl)*.4,k*(.7+fl*.04),0,7);ctx.fill();ctx.stroke()}}
    if(p.dash>0&&Math.abs(p.vx)>3&&frame%3===0)particles.push({x:pcx-p.face*10,y:p.y+p.h-4,vx:-p.face*1.5,vy:rnd(-.6,0),life:16,max:16,c:'#ffb347',r:4,g:0});
  }
  for(const q of particles){
    ctx.globalAlpha=Math.max(0,q.life/q.max);ctx.fillStyle=q.c;
    if(q.star){ctx.beginPath();ctx.arc(q.x,q.y,q.r,0,7);ctx.fill()}
    else if(q.sq)ctx.fillRect(q.x-q.r,q.y-q.r,q.r*2,q.r*2);
    else{ctx.beginPath();ctx.arc(q.x,q.y,q.r,0,7);ctx.fill()}
    ctx.globalAlpha=1;
  }
  for(const t of texts){ctx.globalAlpha=Math.min(1,t.life/20);outlinedText(t.s,t.x,t.y,16,t.color,'#4a3030',4);ctx.globalAlpha=1}
  ctx.restore();
}

  ctx.fillStyle='rgba(20,10,40,.62)';ctx.fillRect(0,0,W,H);
  const g=MINIGAMES[mSel];
  outlinedText(g.name,W/2,92,34,'#fff','#e8344e',8);
  outlinedText(mgame.scoreText||'',W/2,160,32,'#ffe45c',OUT,7);
  outlinedText(`スコア ${mgame.score}`,W/2,214,28,'#fff',OUT,6);
  outlinedText(mNew?'★ しんきろく! ★':`ベスト ${prog.mini[g.id]||0}`,W/2,262,24,mNew?'#ff8aa8':'#fff',OUT,5);
  if(frame%60<40)outlinedText('Enter / 左タップ で もういちど',W/2,330,22,'#fff');
  outlinedText('Esc / 右タップ で ミニゲームえらび',W/2,372,18,'#fff',OUT,4);
}
function drawSelect(){
  TH=THEMES.grass; cam.x=0;cam.y=0;
  drawBackground();
  ctx.fillStyle='rgba(30,20,60,.45)';ctx.fillRect(0,0,W,H);
  outlinedText('ステージえらび',W/2,52,36,'#fff','#e8344e',8);
  outlinedText('◀ もどる',55,24,14,'#fff',OUT,4);
  outlinedText('ミニゲーム (M) ▶',W-80,24,14,'#ffe45c',OUT,4);
  const per=10,page=Math.floor((sel-1)/per),pages=Math.ceil(STAGES.length/per);
  for(let i=0;i<per;i++){
    const n=page*per+i+1; if(n>STAGES.length)break;
    const st=STAGES[n-1],th=THEMES[st.theme]||THEMES.grass,locked=n>prog.unlocked;
    const x=31+(i%5)*150,y=104+Math.floor(i/5)*136,w=138,h=124;
    const bob=n===sel?Math.sin(frame*.15)*3:0;
    ctx.save();ctx.translate(0,bob);
    const g=ctx.createLinearGradient(0,y,0,y+h);g.addColorStop(0,th.sky[0]);g.addColorStop(.6,th.sky[1]);g.addColorStop(1,th.sky[2]);
    ctx.fillStyle=g;rr(x,y,w,h,12);ctx.fill();
    ctx.fillStyle=th.top;ctx.beginPath();ctx.roundRect(x,y+h-22,w,22,[0,0,12,12]);ctx.fill();
    ctx.fillStyle=th.dirt;ctx.fillRect(x,y+h-12,w,12);ctx.beginPath();ctx.roundRect(x,y+h-12,w,12,[0,0,12,12]);ctx.fill();
    ctx.strokeStyle=n===sel?'#ffe45c':OUT;ctx.lineWidth=n===sel?5:3;rr(x,y,w,h,12);ctx.stroke();
    outlinedText(stageLabel(n),x+w/2,y+44,36,'#fff',OUT,6);
    outlinedText(st.name,x+w/2,y+86,15,'#fff',OUT,4);
    if(prog.cleared[n])outlinedText('★',x+w-20,y+20,22,'#ffe45c',OUT,4);
    if(locked){ctx.fillStyle='rgba(40,30,60,.72)';rr(x,y,w,h,12);ctx.fill();outlinedText('ロック',x+w/2,y+h/2,18,'#ddd',OUT,4)}
    ctx.restore();
  }
  if(pages>1){
    outlinedText(`ワールド ${page+1} / ${pages}`,W/2,408,16,'#fff',OUT,4);
    if(page>0)outlinedText('◀',16,224,26,'#fff',OUT,5);
    if(page<pages-1)outlinedText('▶',W-16,224,26,'#fff',OUT,5);
  }
  outlinedText('← → ↑ ↓ えらぶ   Enter / タップ あそぶ   Esc もどる',W/2,pages>1?432:420,13,'#fff',OUT,3);
}

function draw(){
  ctx.setTransform(DPR,0,0,DPR,0,0);
  if(state==='mini'){drawMiniMenu();return}
  if(state==='net'){drawNetMenu();return}
  if(state==='netjoin'){drawNetJoin();return}
  if(state==='netlobby'||state==='netwait'){drawNetLobby();return}
  if(state==='miniplay'){mgame.draw();if(netOn)drawMpBoard();return}
  if(state==='miniresult'){mgame.draw();if(netOn)drawMpResult();else drawMiniResult();return}
  if(state==='title'||state==='select'){
    if(state==='select'){drawSelect();return}
    TH=THEMES.grass;cam.x=0;drawBackground();
    drawWorldTitle();
    outlinedText('まるぽんアクション',W/2,110,56,'#fff','#e8344e',10);
    const b=Math.abs(Math.sin(frame*.07));
    drawChar(W/2,262-b*50,3,{face:1,vx:0,vy:b>.5?-1:1,onGround:b<.05,t:frame,sx:1+(b<.05?.2:-.05*b),sy:1-(b<.05?.2:-.05*b),blink:(frame%180<8)?1:0});
    ctx.fillStyle='rgba(0,0,0,.18)';ctx.beginPath();ctx.ellipse(W/2,266,40-b*14,8-b*3,0,0,7);ctx.fill();
    const on=frame%60<40;
    if(prog.stage!==null){
      outlinedText(`◀ つづきから (C)  ステージ${stageLabel(prog.stage)}`,W*.27,330,19,on?'#ffe45c':'#fff');
      outlinedText('ステージえらび (Enter) ▶',W*.73,330,19,'#fff');
      outlinedText('画面の左右タップでも えらべるよ',W/2,354,13,'#fff','#4a3030',3);
    }else if(on)outlinedText('Enter / タップ で スタート',W/2,330,26,'#fff');
    outlinedText('← → あるく  Space ジャンプ  Shift ダッシュ  C たま  ↓ はいる  P ていし',W/2,380,14,'#fff','#4a3030',4);
    outlinedText('M キーで ミニゲーム ／ ※ ざんこくな ワナに ちゅうい!',W/2,408,15,'#ffe45c','#4a3030',4);
    return;
  }
  drawBackground();
  drawWorld(); drawHUD();
  if(fadeT>0){ctx.fillStyle=`rgba(0,0,0,${fadeT/26})`;ctx.fillRect(0,0,W,H)}
  if(player&&player.clock>0){ctx.fillStyle='rgba(120,190,255,.14)';ctx.fillRect(0,0,W,H)}
  if(state==='pause'){
    ctx.fillStyle='rgba(20,10,40,.62)';ctx.fillRect(0,0,W,H);
    outlinedText('いちじていし',W/2,150,50,'#fff','#e8344e',9);
    outlinedText('▶ つづける  (P / Esc / タップ)',W/2,220,24,frame%60<40?'#ffe45c':'#fff');
    outlinedText('ステージえらびへ  (M / ここをタップ)',W/2,296,20,'#fff',OUT,5);
    outlinedText(`ステージ ${stageLabel(curStage)}  ${STAGES[curStage-1].name}`,W/2,372,16,'#fff',OUT,4);
  }else if(state==='over'){
    ctx.fillStyle='rgba(20,10,40,.6)';ctx.fillRect(0,0,W,H);
    outlinedText('ゲームオーバー',W/2,160,52,'#ff8aa8');
    outlinedText(`ステージ ${stageLabel(curStage)}   スコア ${score}`,W/2,230,24,'#fff');
    if(frame%60<40)outlinedText('5きとも やられたので チェックポイントは むこう!',W/2,282,18,'#ffd9e6');
    outlinedText('Enter / タップ で ステージのさいしょから',W/2,314,22,'#fff');
    outlinedText('Esc で ステージえらび',W/2,350,16,'#fff',OUT,4);
  }else if(state==='clear'){
    ctx.fillStyle='rgba(255,255,255,.25)';ctx.fillRect(0,0,W,H);
    outlinedText('ステージクリア!',W/2,130,52,'#ffe45c','#e8344e',9);
    outlinedText(`コイン ${coins}   スコア ${score}`,W/2,200,24,'#fff');
    const b=Math.abs(Math.sin(frame*.1));
    drawChar(W/2,310-b*30,2,{face:1,vx:0,vy:-1,onGround:false,t:frame,sx:1,sy:1,blink:0});
    const more=curStage<STAGES.length;
    if(frame%60<40)outlinedText(more?`Enter / タップ で つぎへ  ステージ${stageLabel(curStage+1)} ${STAGES[curStage].name}`:'ぜんぶクリア! Enter / タップ で ステージえらびへ',W/2,392,19,'#fff');
    outlinedText('Esc で ステージえらび',W/2,422,14,'#fff',OUT,4);
  }
}
function drawWorldTitle(){
  if(!map||TOWER)return;
  for(let ty=0;ty<ROWS;ty++)for(let tx=0;tx<=26;tx++){const c=tileAt(tx,ty);if(c!==' '&&c!=='H')drawTile(c,tx,ty,tx*T,ty*T)}
}

// ---------- loop ----------
let last=0,accT=0;
function loop(t){
  const dt=Math.min(100,t-last);last=t;accT+=dt;
  while(accT>=1000/60){update();accT-=1000/60}
  draw();requestAnimationFrame(loop);
}
curStage=1;buildLevel();
// 制作用: index.html#s5 でステージ5からすぐ始められる(セーブには影響しない)
{const m=/^#s(\d+)$/.exec(location.hash);if(m&&+m[1]>=1&&+m[1]<=STAGES.length){curStage=+m[1];bannerT=150;loadLevel();state='play'}}
requestAnimationFrame(t=>{last=t;loop(t)});
</script>
</body>
</html>
